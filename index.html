---
layout: default
---

<!-- Hero 区域 -->
<section class="hero">
    <div class="hero-content">
        <h1>{{ site.title }}</h1>
        <p class="tagline">{{ site.tagline }}</p>
        <p class="hero-description">{{ site.description }}</p>
    </div>
</section>

<div class="container">
    <!-- 游戏作品展示 -->
    <h2 class="section-title">游戏作品</h2>

    <div class="games-grid">
        {% for game in site.games %}
        <a href="{{ game.url | relative_url }}" class="game-card" style="text-decoration: none;">
            <div class="game-thumbnail">{{ game.icon | default: "🎮" }}</div>
            <div class="game-info">
                <h3 class="game-title">{{ game.title }}</h3>
                <span class="game-platform">{{ game.platform }}</span>
                <p class="game-description">{{ game.excerpt | strip_html | truncate: 120 }}</p>
                <p class="game-status">{{ game.status }}</p>
            </div>
        </a>
        {% endfor %}
    </div>

</div>

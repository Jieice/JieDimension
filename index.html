---
layout: default
---

<!-- Hero + Projects 合并区域 -->
<section class="hero-compact">
    <div class="hero-content">
        <h1>{{ site.title }}</h1>
        <p class="tagline">{{ site.tagline }}</p>
        <p class="hero-description">{{ site.description }}</p>
    </div>

    <!-- 分类筛选 -->
    <div class="filter-bar">
        <button class="filter-btn active" data-filter="all">全部</button>
        <button class="filter-btn" data-filter="game">🎮 游戏</button>
    </div>

    <!-- 游戏网格 - 一行显示 -->
    <div class="games-grid-compact" id="games-grid">
        {% for game in site.games %}
        <a href="{{ game.url | relative_url }}" class="game-card-compact" style="text-decoration: none;">
            <div class="game-thumb" style="background-image: url('{{ game.image | relative_url }}');"></div>
            <div class="game-info-compact">
                <h3>{{ game.title }}</h3>
                <span>{{ game.platform }}</span>
            </div>
        </a>
        {% endfor %}
    </div>
</section>

<script>
(function() {
    const cards = Array.from(document.querySelectorAll('.game-card-compact'));
    const filterBtns = document.querySelectorAll('.filter-btn');
    
    // 只保留游戏分类
    const isGame = (href) => {
        return !href.includes('anchor') && !href.includes('naga') && !href.includes('godot') && !href.includes('neuro');
    };

    filterBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            filterBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            const filter = btn.dataset.filter;
            cards.forEach(card => {
                const href = card.getAttribute('href') || '';
                if (filter === 'all' || isGame(href)) {
                    card.style.display = '';
                } else {
                    card.style.display = 'none';
                }
            });
        });
    });
})();
</script>

---
layout: default
---

<div class="container">
    <article class="game-detail">
        <header class="game-detail-header">
            <h1>{{ page.title }}</h1>
            <p class="game-platform">{{ page.platform }}</p>
        </header>

        <div class="game-detail-content">
            {{ content }}
        </div>

        {% if page.links %}
        <div class="game-links">
            {% for link in page.links %}
            <a href="{{ link.url }}" class="btn" {% if link.external %}target="_blank"
                rel="noopener" {% endif %}>
                {{ link.text }}
            </a>
            {% endfor %}
        </div>
        {% endif %}

        <footer class="game-detail-footer">
            <a href="{{ '/' | relative_url }}" class="btn btn-secondary">← 返回首页</a>
        </footer>
    </article>
</div>

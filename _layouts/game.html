---
layout: default
---

<div class="container">
    <article class="game-detail">
        <header style="text-align: center; margin-bottom: 2rem;">
            <h1>{{ page.title }}</h1>
            <p class="game-platform">{{ page.platform }}</p>
        </header>

        <div class="game-detail-content"
            style="background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 12px; padding: 2rem; margin-bottom: 2rem;">
            {{ content }}
        </div>

        {% if page.links %}
        <div class="game-links" style="text-align: center; margin-top: 2rem;">
            {% for link in page.links %}
            <a href="{{ link.url }}" class="btn" style="margin: 0.5rem;" {% if link.external %}target="_blank"
                rel="noopener" {% endif %}>
                {{ link.text }}
            </a>
            {% endfor %}
        </div>
        {% endif %}

        <footer style="margin-top: 3rem; text-align: center;">
            <a href="{{ '/' | relative_url }}" class="btn btn-secondary">← 返回首页</a>
        </footer>
    </article>
</div>

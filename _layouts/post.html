---
layout: default
---

<div class="container">
    <article class="post">
        <header class="post-header" style="text-align: center; margin-bottom: 2rem;">
            <h1 class="post-title">{{ page.title }}</h1>
            <div class="post-meta">
                <time datetime="{{ page.date | date_to_xmlschema }}">
                    {{ page.date | date: "%Y年%m月%d日" }}
                </time>
                {% if page.author %}
                <span> · {{ page.author }}</span>
                {% endif %}
            </div>
        </header>

        <div class="post-content">
            {{ content }}
        </div>

        <footer class="post-footer"
            style="margin-top: 3rem; padding-top: 2rem; border-top: 1px solid var(--border-color);">
            <a href="{{ '/blog/' | relative_url }}" class="btn btn-secondary">← 返回博客列表</a>
        </footer>
    </article>
</div>

<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
    
    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ site.url }}{{ page.url | relative_url }}">
    <meta property="og:title" content="{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}">
    <meta property="og:description" content="{{ page.description | default: site.description }}">
    <meta property="og:image" content="{{ site.url }}{{ site.baseurl }}/assets/images/og-image.jpg">
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="{{ site.url }}{{ page.url | relative_url }}">
    <meta property="twitter:title" content="{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}">
    <meta property="twitter:description" content="{{ page.description | default: site.description }}">
    <meta property="twitter:image" content="{{ site.url }}{{ site.baseurl }}/assets/images/og-image.jpg">

    {% seo %}
    {% feed_meta %}
</head>

<body>
    <!-- 导航栏 -->
    <header class="site-header">
        <nav class="nav-container">
            <a href="{{ '/' | relative_url }}" class="site-title">
                <span>{{ site.title }}</span>
                <span class="site-title-cn">{{ site.author.name_cn }}</span>
            </a>
            <div class="site-nav">
                <a href="{{ '/' | relative_url }}">首页</a>
                <a href="{{ '/games/' | relative_url }}">游戏作品</a>
                <a href="{{ '/blender/' | relative_url }}">Blender 作品</a>
                <a href="{{ '/about/' | relative_url }}">关于</a>
            </div>
        </nav>
    </header>

    <!-- 主内容 -->
    <main>
        {{ content }}
    </main>

    <!-- 页脚 -->
    <footer class="site-footer">
        <p>&copy; {{ 'now' | date: "%Y" }} {{ site.author.name_cn }} ({{ site.author.name }})</p>
        <p>{{ site.tagline }}</p>
        <p style="margin-top: 0.5rem;">
            📧 <a href="mailto:{{ site.author.email }}">{{ site.author.email }}</a>
            <span style="margin: 0 0.5rem; opacity: 0.5;">|</span>
            📺 <a href="https://space.bilibili.com/27840409" target="_blank" rel="noopener noreferrer">Bilibili</a>
            <span style="margin: 0 0.5rem; opacity: 0.5;">|</span>
            🎵 <a href="https://v.douyin.com/bZLdhqIbKFQ/" target="_blank" rel="noopener noreferrer">抖音</a>
            <span style="margin: 0 0.5rem; opacity: 0.5;">|</span>
            💬 QQ群：<span style="color: var(--accent-primary); font-weight: 600;">756205360</span>
        </p>
        <p style="margin-top: 0.5rem; font-size: 0.9rem; opacity: 0.7;">
            欢迎加入讨论游戏开发、分享创意想法！
        </p>
    </footer>
    <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>

</html>

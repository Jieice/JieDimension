---
layout: default
title: 开源项目
description: 界维互动的开源项目与游戏作品集
---

<div class="container">
    <h1 class="section-title">开源项目 (Projects)</h1>

    <div class="games-grid">
        {% for game in site.games %}
        <a href="{{ game.url | relative_url }}" class="game-card">
            <figure class="game-thumbnail">
                <picture>
                    {% if game.image_avif %}
                    <source srcset="{{ game.image_avif | relative_url }}" type="image/avif">
                    {% endif %}
                <img src="{{ game.image | relative_url }}" alt="{{ game.title | escape }} 预览" loading="lazy" decoding="async">
                </picture>
            </figure>
            <div class="game-info">
                <h3 class="game-title">{{ game.title }}</h3>
                <span class="game-platform">{{ game.platform }}</span>
                <p class="game-description">{{ game.excerpt | strip_html | truncate: 150 }}</p>
                <p class="game-status">{{ game.status }}</p>
            </div>
        </a>
        {% endfor %}
    </div>
</div>

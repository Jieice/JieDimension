---
layout: default
title: 开源项目
description: 界维互动的开源项目与游戏作品集
---

<div class="container">
    <h1 class="section-title">开源项目 (Projects)</h1>

    <div class="games-grid">
        {% for game in site.games %}
        <a href="{{ game.url | relative_url }}" class="game-card" style="text-decoration: none;">
            <div class="game-thumbnail" style="background-image: url('{{ game.image | relative_url }}'); background-size: cover; background-position: center;"></div>
            <div class="game-info">
                <h3 class="game-title">{{ game.title }}</h3>
                <span class="game-platform">{{ game.platform }}</span>
                <p class="game-description">{{ game.excerpt | strip_html | truncate: 150 }}</p>
                <p class="game-status">{{ game.status }}</p>
            </div>
        </a>
        {% endfor %}
    </div>
</div>

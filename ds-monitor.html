<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DS 号池监控 · JieDimension</title>
<style>
:root {
  --bg: #0d1117;
  --card: #161b22;
  --border: #30363d;
  --text: #e6edf3;
  --muted: #7d8590;
  --green: #3fb950;
  --yellow: #d29922;
  --red: #f85149;
  --accent: #58a6ff;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  min-height: 100vh;
  padding: 24px;
}
.container { max-width: 820px; margin: 0 auto; }
header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 24px; flex-wrap: wrap; gap: 12px;
}
header h1 { font-size: 22px; font-weight: 600; }
header h1 span { color: var(--accent); }
.refresh-info { color: var(--muted); font-size: 13px; }
.summary {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
  margin-bottom: 24px;
}
.stat {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 8px; padding: 16px; text-align: center;
}
.stat .num { font-size: 28px; font-weight: 700; }
.stat .label { color: var(--muted); font-size: 12px; margin-top: 4px; }
.stat.green .num { color: var(--green); }
.stat.yellow .num { color: var(--yellow); }
.stat.red .num { color: var(--red); }
.stat.total .num { color: var(--text); }
.accounts { display: flex; flex-direction: column; gap: 8px; }
.account {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 8px; padding: 14px 18px;
  display: flex; align-items: center; justify-content: space-between;
  transition: border-color 0.2s;
}
.account.ok { border-left: 3px solid var(--green); }
.account.warning { border-left: 3px solid var(--yellow); }
.account.cooldown { border-left: 3px solid var(--yellow); }
.account.dead { border-left: 3px solid var(--red); }
.account .left { display: flex; align-items: center; gap: 12px; }
.dot {
  width: 12px; height: 12px; border-radius: 50%;
  flex-shrink: 0;
}
.dot.ok { background: var(--green); box-shadow: 0 0 8px var(--green); }
.dot.warning { background: var(--yellow); box-shadow: 0 0 8px var(--yellow); }
.dot.cooldown { background: var(--yellow); box-shadow: 0 0 8px var(--yellow); }
.dot.dead { background: var(--red); box-shadow: 0 0 8px var(--red); }
.account .id { font-weight: 600; font-size: 15px; }
.account .badge {
  font-size: 11px; padding: 2px 8px; border-radius: 10px;
  background: var(--border); color: var(--muted);
}
.account .right { color: var(--muted); font-size: 13px; text-align: right; }
.error-banner {
  background: rgba(248,81,73,0.1); border: 1px solid var(--red);
  border-radius: 8px; padding: 14px; margin-bottom: 20px;
  color: var(--red); font-size: 14px;
}
.footer {
  margin-top: 24px; text-align: center; color: var(--muted);
  font-size: 12px;
}
.footer a { color: var(--accent); text-decoration: none; }
.pulse { animation: pulse 2s infinite; }
@keyframes pulse {
  0%,100% { opacity: 1; }
  50% { opacity: 0.4; }
}
@media (max-width: 600px) {
  .summary { grid-template-columns: repeat(2, 1fr); }
  header h1 { font-size: 18px; }
}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>DeepSeek <span>号池监控</span></h1>
    <div class="refresh-info" id="refreshInfo">加载中...</div>
  </header>

  <div id="errorBox"></div>

  <div class="summary">
    <div class="stat total"><div class="num" id="sTotal">-</div><div class="label">总计</div></div>
    <div class="stat green"><div class="num" id="sGreen">-</div><div class="label">在线</div></div>
    <div class="stat yellow"><div class="num" id="sYellow">-</div><div class="label">冷却/警告</div></div>
    <div class="stat red"><div class="num" id="sRed">-</div><div class="label">离线</div></div>
  </div>

  <div class="accounts" id="accList">
    <div class="account"><div class="left"><div class="dot ok pulse"></div><div class="id">等待数据...</div></div></div>
  </div>

  <div class="footer">
    JieDimension · <a href="https://github.com/Jieice/JieDimension" target="_blank">GitHub</a>
  </div>
</div>

<script>
const API_URL = "https://Jieice-ds-api.hf.space/";
const REFRESH_MS = 15000;

const stateText = { ok: "在线", cooldown: "冷却中", warning: "有失败", dead: "离线" };

async function fetchStatus() {
  try {
    const r = await fetch(API_URL, { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const data = await r.json();
    if (data.error) throw new Error(data.error);
    const accs = (data.accounts || []).map(a => {
      let state = "ok";
      if (!a.ready) state = "dead";
      else if (a.cooldown) state = "cooldown";
      else if (a.consecutive_failures > 0) state = "warning";
      return {
        id: a.id, state,
        cooldown_sec: a.cooldown_remaining_sec || 0,
        failures: a.consecutive_failures || 0,
        concurrent: a.concurrent_requests || 0,
        last_used: a.last_used_at || null,
      };
    });
    render({
      total: accs.length,
      ready: accs.filter(a => a.state === "ok").length,
      cooldown: accs.filter(a => a.state === "cooldown").length,
      dead: accs.filter(a => a.state === "dead").length,
      agents: data.agents || 0,
      accounts: accs,
    });
    document.getElementById("errorBox").innerHTML = "";
  } catch (e) {
    document.getElementById("errorBox").innerHTML =
      '<div class="error-banner">无法获取状态: ' + e.message + "</div>";
  }
  document.getElementById("refreshInfo").textContent =
    "更新于 " + new Date().toLocaleTimeString("zh-CN") + " · 每 " + (REFRESH_MS/1000) + "s 刷新";
}

function render(data) {
  document.getElementById("sTotal").textContent = data.total;
  document.getElementById("sGreen").textContent = data.ready;
  document.getElementById("sYellow").textContent = data.cooldown + (data.accounts.filter(a=>a.state==="warning").length);
  document.getElementById("sRed").textContent = data.dead;

  const list = document.getElementById("accList");
  list.innerHTML = "";
  for (const a of data.accounts) {
    const div = document.createElement("div");
    div.className = "account " + a.state;

    let right = "";
    if (a.state === "cooldown" && a.cooldown_sec > 0) {
      right = "冷却剩余 " + a.cooldown_sec + "s";
    } else if (a.state === "warning") {
      right = "连续失败 " + a.failures + " 次";
    } else if (a.state === "dead") {
      right = "token/cookie 失效";
    } else if (a.concurrent > 0) {
      right = "并发 " + a.concurrent;
    } else if (a.last_used) {
      const t = new Date(a.last_used).toLocaleTimeString("zh-CN");
      right = "上次使用 " + t;
    }

    div.innerHTML =
      '<div class="left">' +
        '<div class="dot ' + a.state + (a.state==="ok"?"":" pulse") + '"></div>' +
        '<div class="id">' + a.id + '</div>' +
        '<span class="badge">' + (stateText[a.state]||a.state) + "</span>" +
      "</div>" +
      '<div class="right">' + right + "</div>";
    list.appendChild(div);
  }
}

fetchStatus();
setInterval(fetchStatus, REFRESH_MS);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>API 号池监控 · JieDimension</title>
<style>
:root {
  --bg: #0d1117;
  --card: #161b22;
  --border: #30363d;
  --text: #e6edf3;
  --muted: #7d8590;
  --green: #3fb950;
  --yellow: #d29922;
  --red: #f85149;
  --accent: #58a6ff;
  --purple: #bc8cff;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  min-height: 100vh;
  padding: 24px;
}
.container { max-width: 860px; margin: 0 auto; }
header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 24px; flex-wrap: wrap; gap: 12px;
}
header h1 { font-size: 22px; font-weight: 600; }
header h1 span { color: var(--accent); }
.back-link { color: var(--muted); font-size: 13px; text-decoration: none; }
.back-link:hover { color: var(--accent); }
.refresh-info { color: var(--muted); font-size: 13px; }

.pool-section {
  margin-bottom: 32px;
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
}
.pool-header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 16px 20px;
  background: var(--card);
  border-bottom: 1px solid var(--border);
}
.pool-header h2 { font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.pool-header .pool-url { color: var(--muted); font-size: 12px; word-break: break-all; }
.pool-header .pool-status {
  font-size: 12px; padding: 3px 10px; border-radius: 10px;
  font-weight: 600;
}
.pool-status.online { background: rgba(63,185,80,0.15); color: var(--green); }
.pool-status.offline { background: rgba(248,81,73,0.15); color: var(--red); }
.pool-status.loading { background: rgba(88,166,255,0.15); color: var(--accent); }

.summary {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
  padding: 16px 20px;
}
.stat {
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 8px; padding: 12px; text-align: center;
}
.stat .num { font-size: 24px; font-weight: 700; }
.stat .label { color: var(--muted); font-size: 11px; margin-top: 2px; }
.stat.green .num { color: var(--green); }
.stat.yellow .num { color: var(--yellow); }
.stat.red .num { color: var(--red); }
.stat.total .num { color: var(--text); }

.accounts { padding: 0 20px 16px; display: flex; flex-direction: column; gap: 6px; }
.account {
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 8px; padding: 12px 16px;
  display: flex; align-items: center; justify-content: space-between;
}
.account.ok { border-left: 3px solid var(--green); }
.account.warning { border-left: 3px solid var(--yellow); }
.account.cooldown { border-left: 3px solid var(--yellow); }
.account.dead { border-left: 3px solid var(--red); }
.account .left { display: flex; align-items: center; gap: 10px; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.dot.ok { background: var(--green); box-shadow: 0 0 6px var(--green); }
.dot.warning { background: var(--yellow); box-shadow: 0 0 6px var(--yellow); }
.dot.cooldown { background: var(--yellow); box-shadow: 0 0 6px var(--yellow); }
.dot.dead { background: var(--red); box-shadow: 0 0 6px var(--red); }
.account .id { font-weight: 600; font-size: 14px; }
.account .badge {
  font-size: 10px; padding: 2px 7px; border-radius: 10px;
  background: var(--border); color: var(--muted); margin-left: 8px;
}
.account .right { color: var(--muted); font-size: 12px; text-align: right; }
.no-accounts { color: var(--muted); font-size: 13px; padding: 12px 0; text-align: center; }

.error-banner {
  background: rgba(248,81,73,0.1); border: 1px solid var(--red);
  border-radius: 8px; padding: 12px; margin: 0 20px 16px;
  color: var(--red); font-size: 13px;
}

.footer {
  margin-top: 16px; text-align: center; color: var(--muted);
  font-size: 12px;
}
.footer a { color: var(--accent); text-decoration: none; }
.pulse { animation: pulse 2s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

.ds-color { color: var(--accent); }
.qwen-color { color: var(--purple); }

@media (max-width: 600px) {
  .summary { grid-template-columns: repeat(2, 1fr); }
  header h1 { font-size: 18px; }
  .pool-header { flex-direction: column; align-items: flex-start; gap: 8px; }
}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>API <span>号池监控</span></h1>
    <div>
      <a href="https://www.jiece.art/" class="back-link">&larr; 返回主页</a>
      <span class="refresh-info" id="refreshInfo" style="margin-left:12px;">加载中...</span>
    </div>
  </header>

  <!-- DeepSeek Pool -->
  <div class="pool-section" id="ds-pool">
    <div class="pool-header">
      <div>
        <h2><span class="ds-color">DeepSeek</span> 号池</h2>
        <div class="pool-url">https://ai.autoteam.ccwu.cc/v1</div>
      </div>
      <div class="pool-status loading" id="ds-status">加载中</div>
    </div>
    <div class="summary" id="ds-summary" style="display:none;">
      <div class="stat total"><div class="num" id="ds-total">-</div><div class="label">总计</div></div>
      <div class="stat green"><div class="num" id="ds-green">-</div><div class="label">在线</div></div>
      <div class="stat yellow"><div class="num" id="ds-yellow">-</div><div class="label">冷却/警告</div></div>
      <div class="stat red"><div class="num" id="ds-red">-</div><div class="label">离线</div></div>
    </div>
    <div id="ds-error"></div>
    <div class="accounts" id="ds-accs">
      <div class="no-accounts">等待数据...</div>
    </div>
  </div>

  <!-- Qwen Pool -->
  <div class="pool-section" id="qwen-pool">
    <div class="pool-header">
      <div>
        <h2><span class="qwen-color">Qwen</span> 号池</h2>
        <div class="pool-url">https://ai.autoteam.ccwu.cc/v1</div>
      </div>
      <div class="pool-status loading" id="qwen-status">加载中</div>
    </div>
    <div class="summary" id="qwen-summary" style="display:none;">
      <div class="stat total"><div class="num" id="qwen-total">-</div><div class="label">总计</div></div>
      <div class="stat green"><div class="num" id="qwen-green">-</div><div class="label">在线</div></div>
      <div class="stat yellow"><div class="num" id="qwen-yellow">-</div><div class="label">冷却/警告</div></div>
      <div class="stat red"><div class="num" id="qwen-red">-</div><div class="label">离线</div></div>
    </div>
    <div id="qwen-error"></div>
    <div class="accounts" id="qwen-accs">
      <div class="no-accounts">等待数据...</div>
    </div>
  </div>

  <div class="footer">
    <span id="gateway-info" style="display:block;margin-bottom:8px;color:var(--muted);font-size:11px;">--</span>
    JieDimension &middot; <a href="https://github.com/Jieice/JieDimension" target="_blank">GitHub</a>
  </div>
</div>

<script>
const GATEWAY_URL = "https://ai.autoteam.ccwu.cc/status";
const REFRESH_MS = 15000;
const stateText = { ok: "在线", cooldown: "冷却中", warning: "有失败", dead: "离线" };

async function fetchDS(dsData) {
  const statusEl = document.getElementById("ds-status");
  const summaryEl = document.getElementById("ds-summary");
  const errorEl = document.getElementById("ds-error");
  const accsEl = document.getElementById("ds-accs");

  try {
    if (!dsData || dsData.error) throw new Error(dsData?.error || "无数据");

    const accs = (dsData.accounts || []).map(a => {
      let state = "ok";
      if (!a.ready) state = "dead";
      else if (a.cooldown) state = "cooldown";
      else if (a.consecutive_failures > 0) state = "warning";
      return {
        id: a.id, state,
        cooldown_sec: a.cooldown_remaining_sec || 0,
        failures: a.consecutive_failures || 0,
        concurrent: a.concurrent_requests || 0,
        last_used: a.last_used_at || null,
      };
    });

    summaryEl.style.display = "";
    document.getElementById("ds-total").textContent = accs.length;
    document.getElementById("ds-green").textContent = accs.filter(a => a.state === "ok").length;
    document.getElementById("ds-yellow").textContent = accs.filter(a => a.state === "cooldown" || a.state === "warning").length;
    document.getElementById("ds-red").textContent = accs.filter(a => a.state === "dead").length;

    statusEl.className = "pool-status online";
    statusEl.textContent = "在线 " + accs.filter(a => a.state === "ok").length + "/" + accs.length;
    errorEl.innerHTML = "";

    renderAccounts(accsEl, accs);
  } catch (e) {
    statusEl.className = "pool-status offline";
    statusEl.textContent = "离线";
    summaryEl.style.display = "none";
    errorEl.innerHTML = '<div class="error-banner">无法获取状态: ' + e.message + '</div>';
    accsEl.innerHTML = '<div class="no-accounts">无法连接</div>';
  }
}

async function fetchQwen(qwenData, gw) {
  const statusEl = document.getElementById("qwen-status");
  const summaryEl = document.getElementById("qwen-summary");
  const errorEl = document.getElementById("qwen-error");
  const accsEl = document.getElementById("qwen-accs");

  try {
    if (!qwenData || qwenData.error) throw new Error(qwenData?.error || "无数据");

    const total = typeof qwenData.accounts === 'number' ? qwenData.accounts : (qwenData.total_accounts || 0);
    const active = gw?.qwen_tokens_active || total;

    document.getElementById("qwen-total").textContent = total;
    document.getElementById("qwen-green").textContent = active;
    document.getElementById("qwen-yellow").textContent = 0;
    document.getElementById("qwen-red").textContent = 0;

    statusEl.className = "pool-status online";
    statusEl.textContent = "在线 " + active + "/" + total;
    errorEl.innerHTML = "";
    summaryEl.style.display = "";

    accsEl.innerHTML = '<div class="no-accounts">' + active + ' 个活跃 Token (详情见 Gateway 状态页)</div>';
  } catch (e) {
    statusEl.className = "pool-status offline";
    statusEl.textContent = "离线";
    summaryEl.style.display = "none";
    errorEl.innerHTML = '<div class="error-banner">无法获取状态: ' + e.message + '</div>';
    accsEl.innerHTML = '<div class="no-accounts">无法连接</div>';
  }
}

function renderAccounts(container, accs) {
  container.innerHTML = "";
  if (accs.length === 0) {
    container.innerHTML = '<div class="no-accounts">暂无账号</div>';
    return;
  }
  for (const a of accs) {
    const div = document.createElement("div");
    div.className = "account " + a.state;

    let right = "";
    if (a.state === "cooldown" && a.cooldown_sec > 0) {
      right = "冷却 " + a.cooldown_sec + "s";
    } else if (a.state === "warning") {
      right = "失败 " + a.failures + " 次";
    } else if (a.state === "dead") {
      right = "离线";
    } else if (a.concurrent > 0) {
      right = "并发 " + a.concurrent;
    } else if (a.last_used && a.last_used !== 'never') {
      try {
        const t = new Date(a.last_used).toLocaleTimeString("zh-CN");
        right = "上次 " + t;
      } catch { right = ""; }
    }

    div.innerHTML =
      '<div class="left">' +
        '<div class="dot ' + a.state + '"></div>' +
        '<div class="id">' + a.id + '</div>' +
        '<span class="badge">' + (stateText[a.state]||a.state) + "</span>" +
      "</div>" +
      '<div class="right">' + right + "</div>";
    container.appendChild(div);
  }
}

async function fetchAll() {
  try {
    const r = await fetch(GATEWAY_URL, { cache: "no-store" });
    const data = await r.json();
    await Promise.all([fetchDS(data.deepseek), fetchQwen(data.qwen, data.gateway)]);
    const gw = data.gateway || {};
    if (gw.qwen_token_source) {
      document.getElementById("gateway-info").textContent =
        "Gateway: ai.autoteam.ccwu.cc · Token 来源: " + gw.qwen_token_source +
        " · 活跃: " + (gw.qwen_tokens_active || 0);
    }
  } catch (e) {
    await Promise.all([fetchDS(null), fetchQwen(null)]);
  }
  document.getElementById("refreshInfo").textContent =
    "更新于 " + new Date().toLocaleTimeString("zh-CN") + " · " + (REFRESH_MS/1000) + "s 刷新";
}

fetchAll();
setInterval(fetchAll, REFRESH_MS);
</script>
</body>
</html>

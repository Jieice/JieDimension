<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 号池监控 · JieDimension</title>
<style>
:root {
  --bg: #0a0e14;
  --card: #111621;
  --card-hover: #151c2a;
  --border: #1e2a3a;
  --text: #e0e8f0;
  --muted: #6b7d92;
  --green: #00d47e;
  --green-glow: rgba(0,212,126,0.2);
  --yellow: #ffb300;
  --yellow-glow: rgba(255,179,0,0.15);
  --red: #ff4757;
  --red-glow: rgba(255,71,87,0.15);
  --accent: #3d8bfd;
  --accent-glow: rgba(61,139,253,0.15);
  --purple: #a78bfa;
  --purple-glow: rgba(167,139,250,0.15);
  --cyan: #22d3ee;
  --log-bg: #0d1117;
  --log-border: #1e2a3a;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  min-height: 100vh;
  padding: 20px 16px;
}
.container { max-width: 800px; margin: 0 auto; }

header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 24px; flex-wrap: wrap; gap: 8px;
}
header h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; }
header h1 span {
  background: linear-gradient(135deg, var(--accent), var(--purple));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.header-right { display: flex; align-items: center; gap: 12px; }
.back-link { color: var(--muted); font-size: 12px; text-decoration: none; transition: color 0.2s; }
.back-link:hover { color: var(--accent); }
.refresh-info { color: var(--muted); font-size: 11px; }

.gateway-card {
  background: linear-gradient(135deg, var(--card), #0f1923);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px 20px;
  margin-bottom: 20px;
  display: flex; justify-content: space-between; align-items: center;
  flex-wrap: wrap; gap: 12px;
}
.gateway-card .gw-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
.gateway-card .gw-url { font-size: 14px; font-weight: 600; color: var(--cyan); font-family: monospace; }
.gateway-card .gw-meta { display: flex; gap: 16px; font-size: 12px; color: var(--muted); }
.gateway-card .gw-meta span { display: flex; align-items: center; gap: 4px; }
.gateway-card .gw-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); display: inline-block; }

.pool {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  margin-bottom: 16px;
  overflow: hidden;
  transition: border-color 0.3s;
}
.pool:hover { border-color: rgba(255,255,255,0.08); }

.pool-hd {
  display: flex; justify-content: space-between; align-items: center;
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
}
.pool-hd h2 { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.pool-hd .tag {
  font-size: 10px; padding: 3px 10px; border-radius: 10px;
  font-weight: 600; letter-spacing: 0.5px;
}
.pool-hd .tag.on { background: var(--green-glow); color: var(--green); }
.pool-hd .tag.off { background: var(--red-glow); color: var(--red); }
.pool-hd .url { color: var(--muted); font-size: 11px; font-family: monospace; margin-top: 2px; }

.stats {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px;
  background: var(--border); border-bottom: 1px solid var(--border);
}
.stats .s {
  background: var(--card); padding: 14px 12px; text-align: center;
}
.stats .s .n { font-size: 28px; font-weight: 800; line-height: 1; }
.stats .s .l { color: var(--muted); font-size: 10px; margin-top: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
.stats .s.green .n { color: var(--green); }
.stats .s.yellow .n { color: var(--yellow); }
.stats .s.red .n { color: var(--red); }
.stats .s.total .n { color: var(--text); }

.accs { padding: 8px 12px; }
.acc {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 12px; border-radius: 8px;
  margin-bottom: 4px; transition: background 0.2s;
}
.acc:hover { background: var(--card-hover); }
.acc .left { display: flex; align-items: center; gap: 10px; }
.acc .dot {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
}
.acc .dot.ok { background: var(--green); box-shadow: 0 0 8px var(--green); }
.acc .dot.warning { background: var(--yellow); box-shadow: 0 0 8px var(--yellow); }
.acc .dot.cooldown { background: var(--yellow); box-shadow: 0 0 8px var(--yellow); }
.acc .dot.dead { background: var(--red); box-shadow: 0 0 8px var(--red); }
.acc .name { font-size: 13px; font-weight: 500; }
.acc .badge {
  font-size: 9px; padding: 2px 7px; border-radius: 8px;
  background: var(--border); color: var(--muted); margin-left: 6px;
  text-transform: uppercase; letter-spacing: 0.5px;
}
.acc .right { color: var(--muted); font-size: 11px; }

.tokens-grid {
  display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px;
  padding: 12px 16px;
}
.token-card {
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 8px; padding: 12px; text-align: center;
  transition: border-color 0.2s;
}
.token-card:hover { border-color: var(--purple); }
.token-card .t-icon { font-size: 20px; margin-bottom: 4px; }
.token-card .t-name { font-size: 11px; color: var(--muted); font-weight: 500; }
.token-card .t-status { font-size: 10px; margin-top: 4px; font-weight: 600; }
.token-card.active { border-color: rgba(0,212,126,0.3); }
.token-card.active .t-status { color: var(--green); }
.token-card.cooldown { border-color: rgba(255,179,0,0.3); }
.token-card.cooldown .t-status { color: var(--yellow); }

/* Pagination */
.pagination {
  display: flex; justify-content: center; align-items: center;
  gap: 8px; padding: 12px 16px;
  border-top: 1px solid var(--border);
  flex-wrap: wrap;
}
.pagination button {
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 4px 12px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 12px;
  transition: all 0.2s;
}
.pagination button:hover:not(:disabled) {
  border-color: var(--accent);
  color: var(--accent);
}
.pagination button:disabled {
  opacity: 0.3;
  cursor: not-allowed;
}
.pagination .page-info {
  color: var(--muted);
  font-size: 12px;
}
.pagination .page-num {
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 4px 10px;
  border-radius: 6px;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.2s;
}
.pagination .page-num:hover:not(.active) {
  border-color: var(--accent);
  color: var(--accent);
}
.pagination .page-num.active {
  border-color: var(--accent);
  background: var(--accent-glow);
  color: var(--accent);
}

/* Log Section */
.log-section {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  margin-top: 16px;
  overflow: hidden;
}
.log-section .log-hd {
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  gap: 12px;
  flex-wrap: wrap;
}
.log-section .log-hd h3 {
  font-size: 13px; font-weight: 600;
  color: var(--text);
}
.log-section .log-hd p {
  color: var(--muted);
  font-size: 11px;
  margin-top: 4px;
}
.log-section .log-hd .log-actions {
  display: flex; gap: 8px; flex-wrap: wrap;
}
.log-section .log-hd button,
.log-controls button {
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--muted);
  padding: 6px 12px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 11px;
  transition: all 0.2s;
}
.log-section .log-hd button:hover,
.log-controls button:hover {
  border-color: var(--accent);
  color: var(--accent);
}
.log-controls {
  display: grid;
  grid-template-columns: minmax(180px, 1fr) auto auto auto;
  gap: 8px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  background: rgba(255,255,255,0.015);
}
.log-controls input,
.log-controls select {
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 6px;
  padding: 7px 10px;
  font-size: 12px;
  min-width: 0;
}
.log-controls input::placeholder { color: var(--muted); }
.log-body {
  padding: 8px 12px;
  max-height: 300px;
  overflow-y: auto;
  background: var(--log-bg);
  font-family: monospace;
  font-size: 11px;
  line-height: 1.6;
}
.log-body::-webkit-scrollbar {
  width: 4px;
}
.log-body::-webkit-scrollbar-track {
  background: var(--bg);
}
.log-body::-webkit-scrollbar-thumb {
  background: var(--border);
  border-radius: 2px;
}
.log-entry {
  padding: 2px 0;
  border-bottom: 1px solid rgba(255,255,255,0.03);
  color: var(--muted);
}
.log-entry .log-time {
  color: var(--text2);
  margin-right: 8px;
}
.log-entry .log-level {
  display: inline-block;
  padding: 0 6px;
  border-radius: 3px;
  font-weight: 600;
  margin-right: 6px;
  font-size: 9px;
}
.log-entry .log-level.info { background: var(--accent-glow); color: var(--accent); }
.log-entry .log-level.ok { background: var(--green-glow); color: var(--green); }
.log-entry .log-level.warn { background: var(--yellow-glow); color: var(--yellow); }
.log-entry .log-level.err { background: var(--red-glow); color: var(--red); }
.log-entry .log-msg { color: var(--text); }
.log-entry .log-detail { color: var(--muted); font-size: 10px; }
.call-log-table { min-width: 680px; }
.call-log-row {
  display: grid;
  grid-template-columns: 128px 78px minmax(150px, 1fr) 70px 74px 74px 64px;
  gap: 10px;
  align-items: center;
  padding: 9px 4px;
  border-bottom: 1px solid rgba(255,255,255,0.04);
  color: var(--muted);
}
.call-log-row.head {
  color: var(--muted);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  position: sticky;
  top: 0;
  background: var(--log-bg);
  z-index: 1;
}
.call-log-row .model {
  color: var(--text);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.status-pill {
  display: inline-flex;
  width: fit-content;
  align-items: center;
  justify-content: center;
  padding: 2px 7px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 700;
}
.status-pill.ok { background: var(--green-glow); color: var(--green); }
.status-pill.err { background: var(--red-glow); color: var(--red); }
.status-pill.warn { background: var(--yellow-glow); color: var(--yellow); }

.footer {
  margin-top: 20px; text-align: center; color: var(--muted);
  font-size: 11px; padding: 12px 0;
  border-top: 1px solid var(--border);
}
.footer a { color: var(--accent); text-decoration: none; }

.error-banner {
  background: var(--red-glow); border: 1px solid rgba(255,71,87,0.3);
  border-radius: 8px; padding: 12px; margin: 8px 12px;
  color: var(--red); font-size: 12px;
}
.no-data { color: var(--muted); font-size: 12px; padding: 20px 0; text-align: center; }
.pulse { animation: pulse 2s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }

.ds-color { color: var(--accent); }
.qwen-color { color: var(--purple); }

@media (max-width: 600px) {
  .stats { grid-template-columns: repeat(2, 1fr); }
  .tokens-grid { grid-template-columns: repeat(2, 1fr); }
  header h1 { font-size: 16px; }
  .pool-hd { flex-direction: column; align-items: flex-start; gap: 8px; }
  .gateway-card { flex-direction: column; align-items: flex-start; }
  .log-body { max-height: 160px; font-size: 10px; }
  .log-controls { grid-template-columns: 1fr 1fr; }
  .log-controls input { grid-column: 1 / -1; }
}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>AI <span>号池监控</span></h1>
    <div class="header-right">
      <a href="https://www.jiece.art/" class="back-link">&larr; 返回主页</a>
      <span class="refresh-info" id="refreshInfo">加载中...</span>
    </div>
  </header>

  <!-- Gateway Card -->
  <div class="gateway-card">
    <div>
      <div class="gw-label">统一网关</div>
      <div class="gw-url">ai.autoteam.ccwu.cc</div>
    </div>
    <div class="gw-meta">
      <span><span class="gw-dot"></span> 在线</span>
      <span id="gw-token-source">Token 来源: --</span>
      <span id="gw-token-active">活跃 Token: --</span>
    </div>
  </div>

  <!-- DeepSeek Pool -->
  <div class="pool" id="ds-pool">
    <div class="pool-hd">
      <div>
        <h2><span class="ds-color">DeepSeek</span> 号池</h2>
        <div class="url">https://Jieice-ds-api.hf.space/v1</div>
      </div>
      <div class="pool-status loading" id="ds-status">加载中</div>
    </div>
    <div class="stats" id="ds-summary" style="display:none;">
      <div class="s total"><div class="n" id="ds-total">0</div><div class="l">总计</div></div>
      <div class="s green"><div class="n" id="ds-green">0</div><div class="l">在线</div></div>
      <div class="s yellow"><div class="n" id="ds-yellow">0</div><div class="l">冷却</div></div>
      <div class="s red"><div class="n" id="ds-red">0</div><div class="l">离线</div></div>
    </div>
    <div class="accs" id="ds-accs"></div>
    <div class="pagination" id="ds-pagination" style="display:none;"></div>
  </div>

  <!-- Qwen Pool -->
  <div class="pool" id="qwen-pool">
    <div class="pool-hd">
      <div>
        <h2><span class="qwen-color">Qwen</span> 号池</h2>
        <div class="url">https://jieice-qwen-api.hf.space/v1</div>
      </div>
      <div class="pool-status loading" id="qwen-status">加载中</div>
    </div>
    <div class="stats" id="qwen-summary" style="display:none;">
      <div class="s total"><div class="n" id="qwen-total">0</div><div class="l">总计</div></div>
      <div class="s green"><div class="n" id="qwen-green">0</div><div class="l">在线</div></div>
      <div class="s yellow"><div class="n" id="qwen-yellow">0</div><div class="l">冷却</div></div>
      <div class="s red"><div class="n" id="qwen-red">0</div><div class="l">离线</div></div>
    </div>
    <div class="accs" id="qwen-accs"></div>
    <div class="pagination" id="qwen-pagination" style="display:none;"></div>
  </div>

  <!-- Log Section -->
  <div class="log-section">
    <div class="log-hd">
      <div>
        <h3>模型调用日志</h3>
        <p id="call-log-summary">输入网关 Key 后查询最近调用记录</p>
      </div>
      <div class="log-actions">
        <button id="log-export">导出</button>
      </div>
    </div>
    <div class="log-controls">
      <input id="log-api-key" type="password" autocomplete="off" placeholder="网关 API Key，只保存在本机浏览器">
      <select id="log-limit" aria-label="日志条数">
        <option value="20">最近 20 条</option>
        <option value="50" selected>最近 50 条</option>
        <option value="100">最近 100 条</option>
      </select>
      <button id="log-fetch">查询日志</button>
      <button id="log-clear-key">忘记 Key</button>
    </div>
    <div class="log-body" id="log-body">
      <div class="no-data">等待查询。不会在公开页面里写死 API key。</div>
    </div>
  </div>

  <div class="footer">
    <span id="gateway-info" style="display:block;margin-bottom:8px;color:var(--muted);font-size:11px;">--</span>
    JieDimension &middot; <a href="https://github.com/Jieice/JieDimension" target="_blank">GitHub</a>
  </div>
</div>

<script>
const GATEWAY_URL = "https://ai.autoteam.ccwu.cc/status";
const LOGS_URL = "https://ai.autoteam.ccwu.cc/logs";
const REFRESH_MS = 15000;
const LOG_REFRESH_MS = 30000;
const PAGE_SIZE = 5;
const LOG_KEY_STORAGE = "jiedimension_gateway_api_key";

let dsAccounts = [];
let qwenAccounts = [];
let dsPage = 1;
let qwenPage = 1;
let callLogs = [];

// ----- Logger -----
const logBody = document.getElementById('log-body');
const logSummary = document.getElementById('call-log-summary');
const logKeyInput = document.getElementById('log-api-key');
const logLimitSelect = document.getElementById('log-limit');

function addLog(level, msg, detail) {
  const method = level === 'err' ? 'error' : level === 'warn' ? 'warn' : 'log';
  console[method](`[monitor:${level}] ${msg}`, detail || '');
}

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  }[ch]));
}

function formatLogTime(value) {
  if (!value) return '--';
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return String(value).slice(0, 19);
  return date.toLocaleString('zh-CN', {
    month: '2-digit',
    day: '2-digit',
    hour: '2-digit',
    minute: '2-digit',
    second: '2-digit',
    hour12: false
  });
}

function normalizeCallLog(entry) {
  const status = Number(entry.status || entry.status_code || 0);
  const ok = typeof entry.ok === 'boolean' ? entry.ok : status >= 200 && status < 400;
  const tools = Array.isArray(entry.tools) ? entry.tools.length : (entry.tools ?? entry.tool_count ?? 0);
  return {
    time: entry.ts || entry.timestamp || entry.time,
    pool: entry.pool || entry.backend || '--',
    model: entry.model || '--',
    status,
    ok,
    latency: entry.latency_ms ?? entry.duration_ms ?? entry.ms ?? '--',
    route: entry.route || entry.endpoint || '--',
    tools,
    stream: entry.stream === true,
    error: entry.error || ''
  };
}

function renderLogNotice(message, level = 'info', detail = '') {
  const detailHtml = detail ? `<span class="log-detail"> ${escapeHtml(detail)}</span>` : '';
  logBody.innerHTML = `<div class="log-entry"><span class="log-level ${level}">${level.toUpperCase()}</span><span class="log-msg">${escapeHtml(message)}</span>${detailHtml}</div>`;
}

function renderCallLogs(entries, meta = {}) {
  callLogs = entries.map(normalizeCallLog);
  if (callLogs.length === 0) {
    logSummary.textContent = meta.storage ? `日志接口可用，存储: ${meta.storage}` : '暂无调用记录';
    logBody.innerHTML = '<div class="no-data">暂无调用记录。发起一次模型请求后再查询。</div>';
    return;
  }

  const okCount = callLogs.filter(l => l.ok).length;
  const latest = callLogs[0];
  logSummary.textContent = `最近 ${callLogs.length} 条 · 成功 ${okCount} · 失败 ${callLogs.length - okCount} · 最新 ${formatLogTime(latest.time)}`;
  logBody.innerHTML = `<div class="call-log-table">
    <div class="call-log-row head">
      <span>时间</span><span>池子</span><span>模型</span><span>状态</span><span>耗时</span><span>接口</span><span>工具</span>
    </div>
    ${callLogs.map(log => {
      const statusClass = log.ok ? 'ok' : (log.status ? 'err' : 'warn');
      const statusText = log.status || '未知';
      const latency = typeof log.latency === 'number' ? `${log.latency}ms` : escapeHtml(log.latency);
      const tools = `${escapeHtml(log.tools)}${log.stream ? ' · S' : ''}`;
      const errorTitle = log.error ? ` title="${escapeHtml(log.error)}"` : '';
      return `<div class="call-log-row"${errorTitle}>
        <span>${escapeHtml(formatLogTime(log.time))}</span>
        <span>${escapeHtml(log.pool)}</span>
        <span class="model">${escapeHtml(log.model)}</span>
        <span><span class="status-pill ${statusClass}">${escapeHtml(statusText)}</span></span>
        <span>${latency}</span>
        <span>${escapeHtml(log.route)}</span>
        <span>${tools}</span>
      </div>`;
    }).join('')}
  </div>`;
}

async function fetchCallLogs() {
  const apiKey = logKeyInput.value.trim();
  const limit = logLimitSelect.value || '50';
  if (!apiKey) {
    logSummary.textContent = '输入网关 Key 后查询最近调用记录';
    renderLogNotice('需要输入网关 API Key。Key 只保存在本机浏览器，不会写进网页源码。', 'warn');
    return;
  }

  localStorage.setItem(LOG_KEY_STORAGE, apiKey);
  logSummary.textContent = '正在查询调用日志...';

  try {
    const response = await fetch(`${LOGS_URL}?limit=${encodeURIComponent(limit)}`, {
      cache: 'no-store',
      headers: { 'Authorization': `Bearer ${apiKey}` }
    });

    if (response.status === 404) {
      logSummary.textContent = '后端日志接口未部署';
      renderLogNotice('Worker 还没有 /logs 接口。需要先给网关部署 KV 日志后端。', 'warn');
      return;
    }
    if (response.status === 401 || response.status === 403) {
      logSummary.textContent = '鉴权失败';
      renderLogNotice('网关 Key 不正确，或 /logs 不允许当前 Key 查询。', 'err');
      return;
    }
    if (response.status === 503) {
      logSummary.textContent = '日志存储未启用';
      renderLogNotice('Worker 已有日志接口，但还没有绑定 LOGS KV。', 'warn');
      return;
    }
    if (!response.ok) throw new Error(`HTTP ${response.status}`);

    const data = await response.json();
    renderCallLogs(Array.isArray(data.logs) ? data.logs : [], data);
  } catch (error) {
    logSummary.textContent = '日志查询失败';
    renderLogNotice('无法查询调用日志。', 'err', error.message);
  }
}

document.getElementById('log-export').addEventListener('click', () => {
  if (callLogs.length === 0) {
    renderLogNotice('没有可导出的调用日志。', 'warn');
    return;
  }
  const text = callLogs.map(l => {
    return `[${formatLogTime(l.time)}] ${l.pool} ${l.model} status=${l.status || 'unknown'} ok=${l.ok} latency=${l.latency}ms route=${l.route} tools=${l.tools}${l.error ? ' error=' + l.error : ''}`;
  }).join('\n');
  const blob = new Blob([text], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `model-call-log-${new Date().toISOString().slice(0,10)}.txt`;
  a.click();
});

document.getElementById('log-fetch').addEventListener('click', fetchCallLogs);
document.getElementById('log-clear-key').addEventListener('click', () => {
  localStorage.removeItem(LOG_KEY_STORAGE);
  logKeyInput.value = '';
  callLogs = [];
  logSummary.textContent = '已忘记本机保存的网关 Key';
  renderLogNotice('已清除本机浏览器保存的 Key。', 'info');
});

// ----- Pagination -----
function renderPagination(containerId, accounts, page, setPageFn, poolName) {
  const container = document.getElementById(containerId);
  if (!container) return;
  const totalPages = Math.ceil(accounts.length / PAGE_SIZE);
  if (totalPages <= 1) {
    container.style.display = 'none';
    return;
  }
  container.style.display = 'flex';
  let html = `<button ${page <= 1 ? 'disabled' : ''} data-page="${page-1}">‹</button>`;
  const startPage = Math.max(1, page - 2);
  const endPage = Math.min(totalPages, page + 2);
  if (startPage > 1) html += `<span class="page-num" data-page="1">1</span>${startPage > 2 ? '…' : ''}`;
  for (let p = startPage; p <= endPage; p++) {
    html += `<span class="page-num ${p === page ? 'active' : ''}" data-page="${p}">${p}</span>`;
  }
  if (endPage < totalPages) html += `${endPage < totalPages - 1 ? '…' : ''}<span class="page-num" data-page="${totalPages}">${totalPages}</span>`;
  html += `<button ${page >= totalPages ? 'disabled' : ''} data-page="${page+1}">›</button>`;
  html += `<span class="page-info">${page}/${totalPages}</span>`;
  container.innerHTML = html;
  container.querySelectorAll('[data-page]').forEach(el => {
    el.addEventListener('click', () => {
      const p = parseInt(el.dataset.page);
      if (p >= 1 && p <= totalPages) setPageFn(p, poolName);
    });
  });
}

function renderAccounts(containerId, accounts, page, poolName) {
  const container = document.getElementById(containerId);
  if (!container) return;
  const start = (page - 1) * PAGE_SIZE;
  const end = Math.min(start + PAGE_SIZE, accounts.length);
  const pageItems = accounts.slice(start, end);
  if (pageItems.length === 0) {
    container.innerHTML = '<div class="no-data">暂无账号数据</div>';
    return;
  }
  container.innerHTML = pageItems.map(a => {
    const dotClass = a.state || 'ok';
    const label = a.label || dotClass;
    return `<div class="acc">
      <div class="left">
        <span class="dot ${dotClass}"></span>
        <span class="name">${a.id || 'unknown'}</span>
        <span class="badge">${label}</span>
      </div>
      <div class="right">${a.right || ''}</div>
    </div>`;
  }).join('');
}

function setDsPage(p) {
  dsPage = p;
  renderAccounts('ds-accs', dsAccounts, dsPage, 'ds');
  renderPagination('ds-pagination', dsAccounts, dsPage, setDsPage, 'ds');
}

function setQwenPage(p) {
  qwenPage = p;
  renderAccounts('qwen-accs', qwenAccounts, qwenPage, 'qwen');
  renderPagination('qwen-pagination', qwenAccounts, qwenPage, setQwenPage, 'qwen');
}

// ----- Fetch DS -----
function fetchDS(dsData) {
  const statusEl = document.getElementById("ds-status");
  const summaryEl = document.getElementById("ds-summary");
  const accsEl = document.getElementById("ds-accs");

  if (!dsData || dsData.error) {
    statusEl.className = "pool-status offline";
    statusEl.textContent = "离线";
    summaryEl.style.display = "none";
    accsEl.innerHTML = '<div class="no-data">无法获取数据</div>';
    addLog('err', 'DeepSeek 状态获取失败', dsData?.error || '无响应');
    return;
  }

  const accs = (dsData.accounts || []).map(a => {
    let state = "ok";
    let label = "在线";
    if (!a.ready) { state = "dead"; label = "离线"; }
    else if (a.cooldown) { state = "cooldown"; label = "冷却中"; }
    else if (a.consecutive_failures > 0) { state = "warning"; label = "有失败"; }
    return {
      id: a.id || 'unknown',
      state,
      label,
      right: `并发 ${a.concurrent_requests || 0}`
    };
  });

  dsAccounts = accs;
  const total = accs.length;
  const online = accs.filter(a => a.state === 'ok' || a.state === 'warning').length;
  const cooldown = accs.filter(a => a.state === 'cooldown').length;
  const dead = accs.filter(a => a.state === 'dead').length;

  summaryEl.style.display = "";
  document.getElementById("ds-total").textContent = total;
  document.getElementById("ds-green").textContent = online;
  document.getElementById("ds-yellow").textContent = cooldown;
  document.getElementById("ds-red").textContent = dead;

  statusEl.className = "pool-status online";
  statusEl.textContent = `在线 ${online}/${total}`;

  dsPage = 1;
  setDsPage(1);
  renderPagination('ds-pagination', dsAccounts, dsPage, setDsPage, 'ds');
  addLog('ok', `DeepSeek 更新完成`, `${online}/${total} 在线`);
}

// ----- Fetch Qwen -----
function fetchQwen(qwenData, gw) {
  const statusEl = document.getElementById("qwen-status");
  const summaryEl = document.getElementById("qwen-summary");
  const accsEl = document.getElementById("qwen-accs");

  if (!qwenData || qwenData.error) {
    statusEl.className = "pool-status offline";
    statusEl.textContent = "离线";
    summaryEl.style.display = "none";
    accsEl.innerHTML = '<div class="no-data">无法获取数据</div>';
    addLog('err', 'Qwen 状态获取失败', qwenData?.error || '无响应');
    return;
  }

  const total = typeof qwenData.accounts === 'number' ? qwenData.accounts : (qwenData.total_accounts || 0);
  const active = gw?.qwen_tokens_active || total;

  const accs = [];
  for (let i = 0; i < total; i++) {
    accs.push({
      id: `Token ${i+1}`,
      state: i < active ? 'ok' : 'cooldown',
      label: i < active ? '在线' : '冷却',
      right: i < active ? '活跃' : '待机'
    });
  }

  qwenAccounts = accs;
  summaryEl.style.display = "";
  document.getElementById("qwen-total").textContent = total;
  document.getElementById("qwen-green").textContent = active;
  document.getElementById("qwen-yellow").textContent = total - active;
  document.getElementById("qwen-red").textContent = 0;

  statusEl.className = "pool-status online";
  statusEl.textContent = `在线 ${active}/${total}`;

  qwenPage = 1;
  setQwenPage(1);
  renderPagination('qwen-pagination', qwenAccounts, qwenPage, setQwenPage, 'qwen');

  const source = gw?.qwen_token_source || 'unknown';
  document.getElementById('gw-token-source').textContent = 'Token 来源: ' + source;
  document.getElementById('gw-token-active').textContent = '活跃 Token: ' + active;
  addLog('ok', `Qwen 更新完成`, `${active}/${total} 活跃`);
}

// ----- Fetch All -----
async function fetchAll() {
  const startTime = Date.now();
  try {
    const r = await fetch(GATEWAY_URL, { cache: "no-store" });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    fetchDS(data.deepseek);
    fetchQwen(data.qwen, data.gateway);
    const gw = data.gateway || {};
    document.getElementById("gateway-info").textContent =
      "Gateway: ai.autoteam.ccwu.cc · Token 来源: " + (gw.qwen_token_source || '--') +
      " · 活跃: " + (gw.qwen_tokens_active || 0);
    const elapsed = Date.now() - startTime;
    addLog('info', '状态刷新完成', `耗时 ${elapsed}ms`);
  } catch (e) {
    addLog('err', '获取状态失败', e.message);
    fetchDS(null);
    fetchQwen(null, null);
  }
  document.getElementById("refreshInfo").textContent =
    "更新于 " + new Date().toLocaleTimeString("zh-CN") + " · " + (REFRESH_MS/1000) + "s 刷新";
}

// ----- Init -----
try {
  const savedKey = localStorage.getItem(LOG_KEY_STORAGE);
  if (savedKey) {
    logKeyInput.value = savedKey;
    fetchCallLogs();
  }
} catch {
  renderLogNotice('浏览器阻止了 localStorage，Key 不会被记住。', 'warn');
}

addLog('info', '监控页面启动');
fetchAll();
setInterval(fetchAll, REFRESH_MS);
setInterval(() => {
  if (logKeyInput.value.trim()) fetchCallLogs();
}, LOG_REFRESH_MS);
</script>

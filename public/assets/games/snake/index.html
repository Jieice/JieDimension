<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="snake.title">经典贪吃蛇</title>
    <meta name="description" content="经典贪吃蛇，支持键盘与触控操作。Classic Snake with keyboard and touch controls.">
    <link rel="stylesheet" href="./style.css">
    <script src="../shared/game-i18n.js"></script>
    <script src="./i18n.js"></script>
</head>
<body>
    <main class="app-shell">
        <section class="panel">
            <header class="panel-header">
                <div>
                    <p class="eyebrow" data-i18n="snake.title">经典贪吃蛇</p>
                    <h1 data-i18n="snake.tagline">网格移动 · 吃到食物 · 刷新分数 · 再来一局</h1>
                </div>
                <div class="scoreboard" aria-label="计分板" data-i18n-attr="aria-label:snake.scoreboard">
                    <div class="stat">
                        <span class="stat-label" data-i18n="snake.score">分数</span>
                        <strong id="score">0</strong>
                    </div>
                    <div class="stat">
                        <span class="stat-label" data-i18n="snake.length">长度</span>
                        <strong id="length">3</strong>
                    </div>
                </div>
            </header>

            <div class="toolbar">
                <p id="status" class="status" aria-live="polite" data-i18n="snake.status.ready">按方向键 / WASD，或点触方向键开始。</p>
                <div class="actions">
                    <button id="pause-button" type="button" data-i18n="snake.start">开始</button>
                    <button id="restart-button" type="button" class="secondary" data-i18n="snake.restart">重新开始</button>
                </div>
            </div>

            <div class="game-layout">
                <div class="board-frame">
                    <div id="board" class="board" role="grid" aria-label="贪吃蛇棋盘" data-i18n-attr="aria-label:snake.board"></div>
                </div>

                <aside class="sidebar">
                    <section class="card">
                        <h2 data-i18n="snake.controls">操作</h2>
                        <ul>
                            <li data-i18n="snake.controls.move">方向键或 WASD 移动</li>
                            <li data-i18n="snake.controls.pause">空格 / Enter 或按钮暂停</li>
                            <li data-i18n="snake.controls.restart">R 键或按钮重新开始</li>
                        </ul>
                    </section>

                    <section class="card">
                        <h2 data-i18n="snake.touchpad">触控方向键</h2>
                        <div class="touch-pad" aria-label="触控方向键" data-i18n-attr="aria-label:snake.touchpad.aria">
                            <button type="button" class="pad-button up" data-direction="up" aria-label="上" data-i18n="snake.up" data-i18n-attr="aria-label:snake.up">上</button>
                            <button type="button" class="pad-button left" data-direction="left" aria-label="左" data-i18n="snake.left" data-i18n-attr="aria-label:snake.left">左</button>
                            <button type="button" class="pad-button right" data-direction="right" aria-label="右" data-i18n="snake.right" data-i18n-attr="aria-label:snake.right">右</button>
                            <button type="button" class="pad-button down" data-direction="down" aria-label="下" data-i18n="snake.down" data-i18n-attr="aria-label:snake.down">下</button>
                        </div>
                    </section>
                </aside>
            </div>
        </section>
    </main>

    <script>GameI18N.apply(window.SNAKE_I18N);</script>
    <script type="module" src="./game.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>末世重生：囤货女王 - 互动叙事游戏</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #080810;
            --bg-secondary: #0e0e18;
            --bg-card: rgba(14, 14, 24, 0.85);
            --bg-card-solid: #0e0e18;
            --accent-danger: #c0392b;
            --accent-gold: #d4a017;
            --accent-mystic: #7d3c98;
            --text-primary: #e8e8f0;
            --text-secondary: #8888a0;
            --text-muted: #505068;
            --border-subtle: rgba(255, 255, 255, 0.06);
            --border-glow: rgba(192, 57, 43, 0.25);
            --scene-bg: #080810;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            overflow: hidden;
            font-family: 'Noto Serif SC', serif;
            background: var(--scene-bg);
            color: var(--text-primary);
            transition: background 1.5s ease;
        }

        /* ====== 背景特效层 ====== */
        #rainCanvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0;
        }
        .vignette {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.7) 100%);
            pointer-events: none; z-index: 1;
        }

        /* ====== 开始界面 ====== */
        .start-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-primary);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 100; transition: opacity 0.6s ease;
        }
        .start-screen.hidden { opacity: 0; pointer-events: none; }
        .game-title {
            font-family: 'ZCOOL XiaoWei', serif; font-size: 48px; font-weight: 700;
            text-align: center; margin-bottom: 8px;
            background: linear-gradient(135deg, var(--accent-danger) 0%, var(--accent-gold) 60%, var(--accent-mystic) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .game-subtitle {
            font-size: 14px; color: var(--text-muted); margin-bottom: 36px; letter-spacing: 6px;
        }
        .start-btn {
            background: linear-gradient(135deg, var(--accent-danger), var(--accent-gold));
            border: none; border-radius: 24px; padding: 12px 48px; color: white;
            font-family: 'Noto Serif SC', serif; font-size: 16px; font-weight: 600;
            cursor: pointer; transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(192, 57, 43, 0.3);
        }
        .start-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(192, 57, 43, 0.4); }
        .continue-btn {
            background: transparent; border: 1px solid var(--accent-gold);
            border-radius: 24px; padding: 10px 40px; color: var(--accent-gold);
            font-family: 'Noto Serif SC', serif; font-size: 14px; font-weight: 600;
            cursor: pointer; transition: all 0.3s ease; margin-bottom: 12px;
        }
        .continue-btn:hover { background: var(--accent-gold); color: var(--bg-primary); }

        /* ====== 存档菜单 ====== */
        .save-menu {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(8, 8, 16, 0.96); z-index: 200;
            display: none; flex-direction: column; align-items: center;
            padding: 40px 20px;
        }
        .save-menu-header {
            display: flex; justify-content: space-between; align-items: center;
            width: 100%; max-width: 560px; margin-bottom: 24px;
        }
        .save-menu-title {
            font-family: 'ZCOOL XiaoWei', serif; font-size: 24px;
            color: var(--accent-gold);
        }
        .save-menu-close {
            background: transparent; border: 1px solid var(--text-muted);
            border-radius: 6px; padding: 6px 16px; color: var(--text-secondary);
            cursor: pointer; transition: all 0.3s ease; font-size: 13px;
        }
        .save-menu-close:hover { border-color: var(--accent-danger); color: var(--accent-danger); }
        .save-slots {
            width: 100%; max-width: 560px;
            display: flex; flex-direction: column; gap: 8px;
        }
        .save-slot {
            background: var(--bg-card-solid); border: 1px solid var(--border-subtle);
            border-radius: 8px; padding: 12px 16px;
            display: flex; justify-content: space-between; align-items: center;
            transition: all 0.3s ease;
        }
        .save-slot:hover { border-color: rgba(212, 160, 23, 0.3); }
        .save-slot.empty { opacity: 0.5; }
        .save-info { flex: 1; }
        .save-title { font-size: 14px; font-weight: 600; color: var(--text-primary); margin-bottom: 2px; }
        .save-detail { font-size: 12px; color: var(--text-secondary); margin-bottom: 1px; }
        .save-meta { font-size: 11px; color: var(--text-muted); }
        .save-actions { display: flex; gap: 6px; }
        .save-action-btn {
            padding: 4px 12px; border-radius: 4px; font-size: 11px;
            cursor: pointer; transition: all 0.2s ease; border: none;
        }
        .save-action-btn.load { background: var(--accent-gold); color: white; }
        .save-action-btn.save { background: var(--accent-mystic); color: white; }
        .save-action-btn.delete { background: rgba(192, 57, 43, 0.2); color: var(--accent-danger); }
        .save-action-btn:hover { transform: scale(1.05); }

        /* ====== 游戏主界面 ====== */
        .game-container {
            position: relative; z-index: 2;
            height: 100vh; display: flex; flex-direction: column;
            max-width: 1200px; margin: 0 auto; padding: 8px 24px;
        }

        /* 顶部状态栏 - 单行紧凑 */
        .status-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 6px 12px; flex-shrink: 0;
            border-bottom: 1px solid var(--border-subtle);
            font-size: 12px; color: var(--text-secondary);
        }
        .status-left { display: flex; align-items: center; gap: 12px; }
        .status-right { display: flex; align-items: center; gap: 10px; }
        .chapter-tag {
            font-family: 'ZCOOL XiaoWei', serif; font-size: 13px;
            color: var(--accent-danger); opacity: 0.8;
        }
        .stat-chip {
            display: inline-flex; align-items: center; gap: 3px;
            padding: 2px 8px; border-radius: 10px;
            background: rgba(255,255,255,0.04);
            font-size: 11px;
        }
        .stat-chip .val { color: var(--accent-gold); font-weight: 600; }
        .save-btn {
            background: none; border: none; font-size: 14px;
            cursor: pointer; opacity: 0.5; transition: opacity 0.2s;
            padding: 2px 4px;
        }
        .save-btn:hover { opacity: 1; }

        /* 主内容区 */
        .main-content {
            flex: 1; display: flex; flex-direction: column;
            min-height: 0; margin-top: 6px;
        }

        /* 场景卡 */
        .scene-card {
            flex: 1; background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 10px; padding: 14px 18px;
            position: relative; overflow: hidden;
            display: flex; flex-direction: column; min-height: 0;
            backdrop-filter: blur(12px);
        }
        .scene-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-danger), var(--accent-gold), transparent);
            opacity: 0.6;
        }

        /* 场景头部 - 紧凑 */
        .scene-header {
            display: flex; align-items: baseline; gap: 8px;
            margin-bottom: 4px; flex-shrink: 0;
        }
        .scene-number {
            font-family: 'ZCOOL XiaoWei', serif; font-size: 16px;
            color: var(--accent-danger); font-weight: 700;
        }
        .scene-title { font-size: 16px; font-weight: 600; }
        .scene-atmosphere {
            font-size: 11px; color: var(--text-muted); font-style: italic;
            padding: 3px 10px; background: rgba(0, 0, 0, 0.25);
            border-left: 2px solid var(--accent-mystic); border-radius: 0 4px 4px 0;
            flex-shrink: 0; margin-bottom: 6px;
        }

        /* 场景内容 - 可滚动 */
        .scene-content {
            flex: 1; overflow-y: auto; min-height: 0;
            font-size: 15px; line-height: 1.9; padding-right: 4px;
            scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.08) transparent;
        }
        .scene-content::-webkit-scrollbar { width: 3px; }
        .scene-content::-webkit-scrollbar-track { background: transparent; }
        .scene-content::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 3px; }
        .scene-content p { margin-bottom: 8px; text-indent: 2em; }
        .scene-content p:last-child { margin-bottom: 0; }
        .highlight { color: var(--accent-gold); font-weight: 600; }
        .danger-text { color: var(--accent-danger); font-weight: 600; }

        /* 角色对话框 */
        .dialogue-box {
            display: flex; gap: 10px; margin: 8px 0; padding: 10px;
            background: rgba(0, 0, 0, 0.25); border-radius: 8px;
            border: 1px solid var(--border-subtle);
        }
        .character-avatar {
            width: 36px; height: 36px; border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-mystic), var(--accent-danger));
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; flex-shrink: 0; border: 1px solid rgba(255,255,255,0.08);
        }
        .dialogue-content { flex: 1; }
        .character-name { font-weight: 600; color: var(--accent-gold); margin-bottom: 2px; font-size: 12px; }
        .dialogue-text { font-size: 13px; line-height: 1.7; }

        /* 记忆框 */
        .memory-box {
            background: linear-gradient(135deg, rgba(125, 60, 152, 0.08) 0%, rgba(192, 57, 43, 0.04) 100%);
            border: 1px solid rgba(125, 60, 152, 0.2); border-radius: 8px;
            padding: 10px 12px; margin: 8px 0; position: relative;
        }
        .memory-box::before {
            content: '💭 前世记忆'; position: absolute; top: -7px; left: 12px;
            background: var(--bg-card-solid); padding: 0 6px; font-size: 10px;
            color: var(--accent-mystic); font-weight: 600;
        }
        .memory-text { font-size: 12px; line-height: 1.7; color: var(--text-secondary); font-style: italic; }

        /* ====== 标签面板 - 可折叠抽屉 ====== */
        .tab-panels { flex-shrink: 0; }
        .tab-toggle {
            display: flex; align-items: center; justify-content: space-between;
            padding: 4px 0; cursor: pointer; user-select: none;
            border-top: 1px solid var(--border-subtle); margin-top: 4px;
        }
        .tab-toggle-label {
            font-size: 11px; color: var(--text-muted);
            display: flex; align-items: center; gap: 6px;
        }
        .tab-toggle-arrow {
            font-size: 10px; color: var(--text-muted);
            transition: transform 0.3s ease;
        }
        .tab-toggle-arrow.open { transform: rotate(180deg); }
        .tab-body {
            max-height: 0; overflow: hidden;
            transition: max-height 0.4s ease;
        }
        .tab-body.open { max-height: 180px; }
        .tab-buttons {
            display: flex; gap: 2px; margin-bottom: 6px;
        }
        .tab-btn {
            flex: 1; padding: 4px 0; border: none;
            border-bottom: 2px solid transparent;
            background: transparent;
            color: var(--text-muted); font-size: 11px; cursor: pointer;
            transition: all 0.2s ease; font-family: 'Noto Serif SC', serif;
        }
        .tab-btn.active {
            color: var(--accent-gold);
            border-bottom-color: var(--accent-gold);
        }
        .tab-content {
            padding: 6px 0; max-height: 130px; overflow-y: auto;
            scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.06) transparent;
        }
        .tab-content::-webkit-scrollbar { width: 2px; }
        .tab-content::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.06); border-radius: 2px; }

        /* 物资面板 */
        .inv-header { display: flex; justify-content: space-between; margin-bottom: 4px; }
        .inv-title { font-size: 12px; font-weight: 600; color: var(--accent-gold); }
        .inv-usage { font-size: 10px; color: var(--text-muted); }
        .inv-bar-bg { height: 3px; background: rgba(255,255,255,0.06); border-radius: 2px; margin-bottom: 6px; }
        .inv-bar-fill { height: 100%; background: var(--accent-gold); border-radius: 2px; transition: width 0.5s ease; }
        .inv-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; }
        .inv-item {
            display: flex; align-items: center; gap: 4px; padding: 3px 4px;
            border-radius: 3px; cursor: pointer; transition: background 0.2s;
        }
        .inv-item:hover { background: rgba(255,255,255,0.04); }
        .inv-icon { font-size: 12px; }
        .inv-info { flex: 1; }
        .inv-name { font-size: 10px; color: var(--text-secondary); display: block; }
        .inv-mini-bar { height: 2px; background: rgba(255,255,255,0.06); border-radius: 1px; margin-top: 1px; }
        .inv-mini-fill { height: 100%; border-radius: 1px; transition: width 0.5s ease; }
        .inv-amount { font-size: 11px; font-weight: 600; min-width: 20px; text-align: right; }

        /* 关系面板 */
        .rel-header { margin-bottom: 4px; }
        .rel-title { font-size: 12px; font-weight: 600; color: var(--accent-mystic); }
        .rel-list { display: flex; flex-direction: column; gap: 2px; }
        .rel-item { display: flex; align-items: center; gap: 4px; padding: 2px 0; }
        .rel-emoji { font-size: 12px; }
        .rel-name { font-size: 11px; color: var(--text-primary); min-width: 44px; }
        .rel-bar-bg { flex: 1; height: 3px; background: rgba(255,255,255,0.06); border-radius: 2px; }
        .rel-bar-fill { height: 100%; border-radius: 2px; transition: width 0.5s ease; }
        .rel-value { font-size: 10px; font-weight: 600; min-width: 28px; text-align: right; }
        .rel-status { font-size: 9px; min-width: 24px; text-align: right; }

        /* 能力面板 */
        .ability-list { display: flex; flex-direction: column; gap: 3px; margin-bottom: 6px; }
        .ability-item {
            display: flex; align-items: center; gap: 6px; padding: 3px 4px;
            border-radius: 3px; background: rgba(0,0,0,0.15);
        }
        .ability-icon { font-size: 14px; }
        .ability-info { flex: 1; }
        .ability-name { font-size: 11px; font-weight: 600; color: var(--text-primary); display: block; }
        .ability-desc { font-size: 9px; color: var(--text-muted); display: block; }
        .ability-status { font-size: 10px; font-weight: 600; }
        .energy-bar {
            display: flex; align-items: center; gap: 6px; font-size: 10px; color: var(--text-muted);
        }
        .energy-bar .inv-bar-bg { flex: 1; }
        .energy-bar .inv-bar-fill { background: var(--accent-mystic); }

        /* 选择区 */
        .choices-container {
            display: flex; flex-direction: column; gap: 5px;
            flex-shrink: 0; margin-top: 6px;
        }
        .choice-btn {
            background: rgba(192, 57, 43, 0.06);
            border: 1px solid rgba(192, 57, 43, 0.15); border-radius: 6px;
            padding: 10px 14px; color: var(--text-primary);
            font-family: 'Noto Serif SC', serif; font-size: 14px;
            cursor: pointer; transition: all 0.25s ease; text-align: left;
            position: relative; overflow: hidden;
        }
        .choice-btn::before {
            content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
            background: var(--accent-danger); transition: width 0.25s ease;
        }
        .choice-btn:hover {
            background: rgba(192, 57, 43, 0.12);
            border-color: rgba(192, 57, 43, 0.35); transform: translateX(3px);
        }
        .choice-btn:hover::before { width: 4px; }
        .choice-label {
            display: inline-block; background: var(--accent-danger); color: white;
            padding: 0 6px; border-radius: 3px; font-size: 10px;
            margin-right: 6px; font-weight: 600; line-height: 1.6;
        }

        /* ====== AI对话区 - 极简底栏 ====== */
        .ai-chat-section {
            flex-shrink: 0; padding: 6px 0 2px;
            border-top: 1px solid var(--border-subtle);
            margin-top: 6px;
        }
        .ai-top-row {
            display: flex; align-items: center; gap: 4px; margin-bottom: 4px;
        }
        .ai-quick-actions { display: flex; gap: 3px; flex: 1; flex-wrap: nowrap; overflow-x: auto; }
        .quick-btn {
            background: rgba(125, 60, 152, 0.1); border: 1px solid rgba(125, 60, 152, 0.15);
            border-radius: 10px; padding: 2px 8px; color: var(--text-muted);
            font-family: 'Noto Serif SC', serif; font-size: 10px; cursor: pointer;
            transition: all 0.2s ease; white-space: nowrap; flex-shrink: 0;
        }
        .quick-btn:hover { background: rgba(125, 60, 152, 0.2); color: var(--text-primary); }
        .model-btn {
            background: rgba(125, 60, 152, 0.1); border: 1px solid rgba(125, 60, 152, 0.15);
            border-radius: 10px; padding: 2px 8px; color: var(--text-muted);
            font-family: 'Noto Serif SC', serif; font-size: 10px; cursor: pointer;
            transition: all 0.2s ease; white-space: nowrap; flex-shrink: 0;
        }
        .model-btn:hover { background: rgba(125, 60, 152, 0.2); color: var(--text-primary); }
        .model-btn.active { background: var(--accent-mystic); color: white; border-color: var(--accent-mystic); }
        .ai-chat-input-area { display: flex; gap: 6px; }
        .ai-chat-input {
            flex: 1; background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(125, 60, 152, 0.15); border-radius: 16px;
            padding: 6px 14px; color: var(--text-primary);
            font-family: 'Noto Serif SC', serif; font-size: 12px; outline: none;
        }
        .ai-chat-input:focus { border-color: rgba(125, 60, 152, 0.4); }
        .ai-chat-input::placeholder { color: var(--text-muted); }
        .ai-chat-btn {
            background: var(--accent-mystic); border: none; border-radius: 16px;
            padding: 6px 14px; color: white; font-family: 'Noto Serif SC', serif;
            font-size: 12px; cursor: pointer; transition: all 0.3s ease;
            flex-shrink: 0;
        }
        .ai-chat-btn:hover { background: #6c3483; }
        .ai-chat-btn:disabled { background: var(--text-muted); cursor: not-allowed; }

        /* AI响应 - 浮层 */
        .ai-response {
            margin-top: 4px; padding: 8px 10px; background: rgba(125, 60, 152, 0.08);
            border: 1px solid rgba(125, 60, 152, 0.12); border-radius: 6px;
            font-size: 12px; line-height: 1.7;
            display: none; max-height: 100px; overflow-y: auto;
            scrollbar-width: thin; scrollbar-color: rgba(125,60,152,0.2) transparent;
        }
        .ai-response::-webkit-scrollbar { width: 2px; }
        .ai-response::-webkit-scrollbar-thumb { background: rgba(125,60,152,0.2); border-radius: 2px; }
        .ai-response.show { display: block; }

        /* ====== 战斗系统 ====== */
        .battle-container {
            margin: 6px 0;
            background: rgba(192, 57, 43, 0.06);
            border: 1px solid rgba(192, 57, 43, 0.2);
            border-radius: 8px; padding: 10px;
            animation: battleShake 0.3s ease;
        }
        @keyframes battleShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-2px); }
            75% { transform: translateX(2px); }
        }
        .battle-header {
            text-align: center; font-size: 13px; font-weight: 600;
            color: var(--accent-danger); margin-bottom: 8px;
        }
        .battle-field {
            display: flex; align-items: center; justify-content: space-between;
            gap: 6px; margin-bottom: 8px;
        }
        .battle-unit {
            flex: 1; display: flex; align-items: center; gap: 6px;
            padding: 6px; border-radius: 6px; background: rgba(0, 0, 0, 0.2);
        }
        .battle-icon { font-size: 24px; }
        .battle-unit-info { flex: 1; }
        .battle-name { font-size: 11px; font-weight: 600; color: var(--text-primary); display: block; margin-bottom: 2px; }
        .battle-hp-bar { height: 4px; background: rgba(255,255,255,0.08); border-radius: 2px; margin-bottom: 1px; }
        .battle-hp-fill { height: 100%; border-radius: 2px; transition: width 0.3s ease; }
        .battle-hp-text { font-size: 9px; color: var(--text-muted); }
        .battle-vs { font-size: 14px; font-weight: 700; color: var(--accent-danger); flex-shrink: 0; }
        .battle-log {
            max-height: 48px; overflow-y: auto; margin-bottom: 6px;
            padding: 4px; background: rgba(0, 0, 0, 0.15); border-radius: 4px;
            scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.06) transparent;
        }
        .battle-log-entry { font-size: 11px; line-height: 1.5; color: var(--text-secondary); }
        .battle-log-entry:last-child { color: var(--text-primary); font-weight: 600; }
        .battle-actions { display: flex; gap: 4px; }
        .battle-btn {
            flex: 1; padding: 6px 2px; border: 1px solid rgba(255,255,255,0.08);
            border-radius: 4px; background: rgba(0, 0, 0, 0.2);
            color: var(--text-primary); font-family: 'Noto Serif SC', serif;
            font-size: 11px; cursor: pointer; transition: all 0.2s ease; text-align: center;
        }
        .battle-btn:hover { transform: translateY(-1px); }
        .battle-btn.attack { border-color: rgba(192, 57, 43, 0.3); }
        .battle-btn.attack:hover { background: rgba(192, 57, 43, 0.15); }
        .battle-btn.item { border-color: rgba(46, 204, 113, 0.3); }
        .battle-btn.item:hover { background: rgba(46, 204, 113, 0.15); }
        .battle-btn.skill { border-color: rgba(125, 60, 152, 0.3); }
        .battle-btn.skill:hover { background: rgba(125, 60, 152, 0.15); }
        .battle-btn.flee { border-color: rgba(212, 160, 23, 0.3); }
        .battle-btn.flee:hover { background: rgba(212, 160, 23, 0.15); }

        /* 结局预测 */
        .ending-prediction { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--border-subtle); }
        .ending-none { font-size: 11px; color: var(--text-muted); text-align: center; padding: 4px; }
        .ending-bars { display: flex; flex-direction: column; gap: 2px; }
        .ending-bar-item { display: flex; align-items: center; gap: 4px; }
        .ending-bar-icon { font-size: 11px; }
        .ending-bar-name { font-size: 10px; color: var(--text-secondary); min-width: 32px; }
        .ending-bar-bg { flex: 1; height: 3px; background: rgba(255,255,255,0.06); border-radius: 2px; }
        .ending-bar-fill { height: 100%; border-radius: 2px; transition: width 0.5s ease; }
        .ending-bar-pct { font-size: 9px; font-weight: 600; min-width: 24px; text-align: right; }
        .ending-recommend { font-size: 11px; font-weight: 600; text-align: center; margin-top: 4px; padding: 3px; background: rgba(0,0,0,0.15); border-radius: 3px; }

        /* 作死结局 */
        .death-ending {
            background: rgba(192, 57, 43, 0.1); border: 1px solid rgba(192, 57, 43, 0.3);
            border-radius: 6px; padding: 10px; font-size: 13px; line-height: 1.8;
            color: var(--text-primary); margin-bottom: 6px;
        }
        .death-restart-btn {
            background: var(--accent-danger); border: none; border-radius: 4px;
            padding: 6px 16px; color: white; font-family: 'Noto Serif SC', serif;
            font-size: 12px; cursor: pointer; transition: all 0.2s ease;
        }
        .death-restart-btn:hover { background: #a93226; }

        /* 淡入动画 */
        .fade-in { animation: fadeIn 0.35s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

        /* 场景内容内的列表 */
        .scene-content ul { margin: 6px 0; padding-left: 20px; line-height: 1.8; font-size: 13px; }

        /* Toast */
        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateX(-50%) translateY(-10px); }
            15% { opacity: 1; transform: translateX(-50%) translateY(0); }
            85% { opacity: 1; transform: translateX(-50%) translateY(0); }
            100% { opacity: 0; transform: translateX(-50%) translateY(-10px); }
        }

        /* 响应式 - 平板 */
        @media (max-width: 1024px) {
            .game-container { max-width: 95%; padding: 8px 16px; }
            .scene-content { font-size: 15px; }
            .choice-btn { font-size: 14px; padding: 10px 14px; }
        }

        /* 响应式 - 手机 */
        @media (max-width: 768px) {
            .game-title { font-size: 28px; }
            .game-subtitle { font-size: 12px; letter-spacing: 3px; }
            .game-container { max-width: 100%; padding: 6px 12px; }
            .scene-card { padding: 12px 14px; }
            .scene-content { font-size: 15px; line-height: 1.9; }
            .scene-number { font-size: 15px; }
            .scene-title { font-size: 16px; }
            .scene-atmosphere { font-size: 12px; }
            .dialogue-box { gap: 8px; padding: 10px; }
            .character-avatar { width: 32px; height: 32px; font-size: 16px; }
            .dialogue-text { font-size: 14px; }
            .choice-btn { padding: 10px 12px; font-size: 14px; }
            .status-bar { font-size: 11px; }
            .chapter-tag { font-size: 12px; }
            .ai-chat-input { font-size: 14px; }
            .quick-btn, .model-btn { font-size: 11px; padding: 3px 10px; }
        }

        /* 响应式 - 小屏手机 */
        @media (max-width: 480px) {
            .game-title { font-size: 24px; }
            .game-container { padding: 4px 10px; }
            .scene-card { padding: 10px 12px; }
            .scene-content { font-size: 15px; }
            .choice-btn { padding: 10px 12px; font-size: 14px; }
            .tab-toggle-label { font-size: 10px; }
            .ai-top-row { flex-wrap: wrap; }
            .ai-quick-actions { order: 2; width: 100%; margin-top: 4px; }
        }
    </style>
</head>
<body>
    <canvas id="rainCanvas"></canvas>
    <div class="vignette"></div>

    <!-- 开始界面 -->
    <div class="start-screen" id="startScreen">
        <h1 class="game-title">末世重生：囤货女王</h1>
        <p class="game-subtitle">互动叙事游戏</p>
        <button class="continue-btn" id="continueBtn" onclick="continueGame()" style="display:none;">📂 继续游戏</button>
        <button class="start-btn" onclick="startGame()">🎮 开始重生</button>
    </div>

    <!-- 存档菜单 -->
    <div class="save-menu" id="saveMenu">
        <div class="save-menu-header">
            <h2 class="save-menu-title">💾 存档管理</h2>
            <button class="save-menu-close" onclick="closeSaveMenu()">关闭</button>
        </div>
        <div class="save-slots" id="saveSlots"></div>
    </div>

    <!-- 游戏主界面 -->
    <div class="game-container" id="gameContainer" style="display: none;">
        <!-- 状态栏 - 单行 -->
        <div class="status-bar">
            <div class="status-left">
                <span class="chapter-tag" id="chapterIndicator">第一幕：重生囤货</span>
                <span class="stat-chip">📅 <span class="val" id="daysLeft">30天</span></span>
                <span class="stat-chip">💰 <span class="val" id="money">50万</span></span>
            </div>
            <div class="status-right">
                <button class="save-btn" onclick="openSaveMenu()" title="存档/读档">💾</button>
            </div>
        </div>

        <div class="main-content">
            <div class="scene-card">
                <div class="scene-header">
                    <span class="scene-number" id="sceneNumber">序章</span>
                    <span class="scene-title" id="sceneTitle">惨死重生</span>
                </div>
                <div class="scene-atmosphere" id="sceneAtmosphere">极寒末世 · 温度-40°C · 断粮第7天</div>
                <div class="scene-content" id="sceneContent"></div>

                <!-- 可折叠面板 -->
                <div class="tab-panels" id="tabPanels">
                    <div class="tab-toggle" onclick="toggleTabPanel()">
                        <span class="tab-toggle-label">🎒 物资 · 👥 关系 · ⚡ 能力</span>
                        <span class="tab-toggle-arrow" id="tabArrow">▼</span>
                    </div>
                    <div class="tab-body" id="tabBody">
                        <div class="tab-buttons">
                            <button class="tab-btn active" onclick="switchTab('inventory')">物资</button>
                            <button class="tab-btn" onclick="switchTab('relationships')">关系</button>
                            <button class="tab-btn" onclick="switchTab('abilities')">能力</button>
                        </div>
                        <div class="tab-content" id="inventoryPanel"></div>
                        <div class="tab-content" id="relationshipPanel" style="display:none;"></div>
                        <div class="tab-content" id="abilitiesPanel" style="display:none;"></div>
                    </div>
                </div>

                <div class="battle-container" id="battleContainer" style="display:none;"></div>
                <div class="choices-container" id="choicesContainer"></div>
            </div>

            <!-- AI对话 - 极简底栏 -->
            <div class="ai-chat-section">
                <div class="ai-top-row">
                    <div class="ai-quick-actions">
                        <button class="quick-btn" onclick="quickAsk('分析我的选择')">📊 风格</button>
                        <button class="quick-btn" onclick="quickAsk('现在该怎么办？')">💡 建议</button>
                        <button class="quick-btn" onclick="quickAsk('生成内心独白')">💭 独白</button>
                        <button class="quick-btn" onclick="quickAsk('我的结局是什么？')">🔮 结局</button>
                    </div>
                    <span id="modelSelector" style="display:flex;gap:3px;"></span>
                </div>
                <div class="ai-chat-input-area">
                    <input type="text" class="ai-chat-input" id="aiInput" placeholder="问AI助手...">
                    <button class="ai-chat-btn" id="aiSendBtn" onclick="sendToAI()">发送</button>
                </div>
                <div class="ai-response" id="aiResponse"></div>
            </div>
        </div>
    </div>

    <script src="story.js?v=2026"></script>
    <script src="game.js?v=2026"></script>
</body>
</html>

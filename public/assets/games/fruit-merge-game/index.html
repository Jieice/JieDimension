<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="水果合成：投放水果、同级相撞合成更大的水果，别让果堆越过红线。"
        data-i18n-attr="content:fruit.doc.description">
    <meta name="keywords" content="fruit, merge, puzzle, game, casual, html5">
    <title data-i18n="fruit.doc.title">水果合成狂热 Fruit Merge Mania</title>
    <link rel="stylesheet" href="css/style.css">

    <!-- 语言桥：读取主站同一个 jiedim.lang 键，让游戏界面跟随站点语言 -->
    <script src="../shared/game-i18n.js"></script>
    <script src="./i18n.js"></script>

    <!-- Phaser 3 引擎：本地优先，避免国内访问 CDN 失败导致白屏 -->
    <script src="js/lib/phaser.min.js"></script>
    <script>
        // 本地引擎缺失时回退 CDN；解析期注入可保持后续脚本顺序不变
        if (!window.Phaser) {
            document.write('<script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"><\/script>');
        }
    </script>
</head>

<body>
    <div id="game-container">
        <div id="game"></div>
        <div id="loading" class="loading-screen">
            <div class="loading-spinner"></div>
            <p id="loadingText" data-i18n="fruit.loading">加载中…</p>
            <button id="loadingRetry" type="button" hidden data-i18n="fruit.reload">重新加载</button>
        </div>
    </div>

    <!-- 启动守卫：加载屏只在游戏真正就绪后隐藏，超时或报错则给出可重试提示 -->
    <script>
        (function () {
            var loading = document.getElementById('loading');
            var text = document.getElementById('loadingText');
            var retry = document.getElementById('loadingRetry');
            var spinner = loading && loading.querySelector('.loading-spinner');
            var settled = false;

            window.__fruitMergeReady = function () {
                if (settled) return;
                settled = true;
                if (loading) loading.style.display = 'none';
            };

            window.__fruitMergeFail = function () {
                if (settled) return;
                settled = true;
                if (spinner) spinner.style.display = 'none';
                if (text) text.textContent = FT("fruit.loadFail");
                if (retry) retry.hidden = false;
            };

            if (retry) {
                retry.addEventListener('click', function () { location.reload(); });
            }
            setTimeout(window.__fruitMergeFail, 8000);
        })();

        GameI18N.apply(window.FRUIT_MERGE_I18N);
    </script>

    <!-- Game Scripts -->
    <script src="js/utils/FruitConfig.js"></script>
    <script src="js/utils/ScoreManager.js"></script>
    <script src="js/utils/AudioManager.js"></script>
    <script src="js/objects/Fruit.js"></script>
    <script src="js/scenes/BootScene.js"></script>
    <script src="js/scenes/MenuScene.js"></script>
    <script src="js/scenes/PauseScene.js"></script>
    <script src="js/scenes/GameScene.js"></script>
    <script src="js/scenes/GameOverScene.js"></script>
    <script src="js/main.js"></script>
</body>

</html>

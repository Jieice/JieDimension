<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — JieDimension</title>
  <link rel="icon" href="/favicon/favicon.ico" />
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #06080f; color: #c8d0e8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; text-align: center; padding: 24px; }
    .wrap { max-width: 480px; }
    .code { font-family: "Orbitron", monospace; font-size: 6rem; font-weight: 900; background: linear-gradient(135deg, #00f5ff, #ff2db4); -webkit-background-clip: text; background-clip: text; color: transparent; line-height: 1; margin-bottom: 16px; }
    h1 { font-size: 1.4rem; color: #f5f7ff; margin-bottom: 12px; font-weight: 700; }
    p { color: #8b95b3; margin-bottom: 24px; line-height: 1.6; }
    a { display: inline-block; padding: 12px 22px; background: linear-gradient(135deg, #00f5ff, #ff2db4); color: #000; border-radius: 8px; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <h1>页面未找到 / Page Not Found</h1>
    <p>你访问的页面不存在或已被移动。<br/>The page you're looking for doesn't exist or has been moved.</p>
    <a href="/">← 返回首页 / Back to Home</a>
  </div>
</body>
</html>

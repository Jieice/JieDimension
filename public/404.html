<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — JieDimension</title>
  <meta name="theme-color" content="#fff8fa" />
  <link rel="icon" href="/favicon/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&family=Baloo+2:wght@500;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #fff8fa;
      --ink: #584a54;
      --ink-2: #8a7580;
      --pink-deep: #ff4d94;
      --pink-soft: #ffd6e6;
      --sakura: #ffb7cf;
      --grad-main: linear-gradient(135deg, #ff9ec7 0%, #ff6fae 50%, #ff4d94 100%);
      --font-hand: "LXGW WenKai", "Zen Maru Gothic", "Noto Sans SC", sans-serif;
      --font-disp: "Baloo 2", "Zen Maru Gothic", sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; display: grid; place-items: center;
      background: linear-gradient(180deg, #d8f1ff 0%, #ffeef4 60%, #fff8fa 100%);
      color: var(--ink); font-family: "Zen Maru Gothic", "Noto Sans SC", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      text-align: center; padding: 24px; overflow: hidden; position: relative;
    }
    .petal {
      position: absolute; top: -8vh;
      border-radius: 62% 38% 55% 45% / 55% 48% 52% 45%;
      background: linear-gradient(135deg, #ffd1e3, #ff9ec4);
      opacity: 0.8;
      animation: fall linear infinite;
      box-shadow: inset -2px -2px 4px rgba(255, 77, 148, 0.18);
      pointer-events: none;
    }
    @keyframes fall {
      0%   { transform: translateY(-6vh) translateX(0) rotate(0deg); }
      25%  { transform: translateY(25vh) translateX(6vw) rotate(120deg); }
      50%  { transform: translateY(50vh) translateX(-4vw) rotate(240deg); }
      75%  { transform: translateY(75vh) translateX(5vw) rotate(300deg); }
      100% { transform: translateY(110vh) translateX(-2vw) rotate(420deg); }
    }
    .wrap { max-width: 480px; position: relative; z-index: 2; }
    .code {
      font-family: var(--font-disp); font-size: 7rem; font-weight: 800; line-height: 1;
      background: var(--grad-main);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      margin-bottom: 8px; position: relative; display: inline-block;
    }
    .code::after {
      content: "✿"; position: absolute; top: -0.15em; right: -0.75em;
      font-size: 0.3em; color: var(--sakura);
      -webkit-text-fill-color: var(--sakura);
      animation: spin 6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .card {
      background: #fff; border: 3px solid #fff; border-radius: 24px;
      box-shadow: 0 10px 30px -12px rgba(255, 77, 148, 0.25);
      padding: 34px 30px; position: relative;
      transform: rotate(-1.5deg);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .card:hover { transform: rotate(0) translateY(-6px); box-shadow: 0 16px 40px -14px rgba(255, 77, 148, 0.4); }
    .card::before {
      content: ""; position: absolute; top: -10px; left: 50%; transform: translateX(-50%) rotate(-4deg);
      width: 64px; height: 20px;
      background: rgba(255, 217, 138, 0.85);
      border-radius: 2px; box-shadow: 0 2px 5px rgba(0, 0, 0, 0.08);
    }
    h1 { font-family: var(--font-hand); font-size: 1.4rem; color: var(--ink); margin-bottom: 10px; font-weight: 900; }
    p { color: var(--ink-2); margin-bottom: 24px; line-height: 1.75; font-family: var(--font-hand); }
    a {
      display: inline-flex; align-items: center; gap: 10px;
      padding: 13px 30px; border-radius: 999px;
      background: var(--grad-main); color: #fff;
      font-weight: 800; text-decoration: none;
      box-shadow: 0 10px 24px -8px rgba(255, 77, 148, 0.55);
      transition: all 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    a:hover { transform: translateY(-4px) scale(1.03); box-shadow: 0 16px 40px -14px rgba(255, 77, 148, 0.4); }
    @media (prefers-reduced-motion: reduce) { .petal, .code::after { animation: none; } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <div class="card">
      <h1>这片花海里没有这一页 / Page Not Found</h1>
      <p>你访问的页面不存在，或已随风飘走了。<br/>The page you're looking for doesn't exist or has been moved.</p>
      <a href="/">← 返回首页 / Back to Home</a>
    </div>
  </div>
  <script>
    (function () {
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      for (var i = 0; i < 14; i++) {
        var p = document.createElement("i");
        p.className = "petal";
        var size = 8 + Math.random() * 8;
        var dur = 9 + Math.random() * 9;
        p.style.width = size + "px";
        p.style.height = size * 0.82 + "px";
        p.style.left = Math.random() * 100 + "vw";
        p.style.opacity = (0.45 + Math.random() * 0.45).toFixed(2);
        p.style.animationDuration = dur + "s";
        p.style.animationDelay = -Math.random() * dur + "s";
        document.body.appendChild(p);
      }
    })();
  </script>
</body>
</html>

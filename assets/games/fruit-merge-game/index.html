<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Fruit Merge Mania - Addictive merge puzzle game! Drop fruits and merge them!">
    <meta name="keywords" content="fruit, merge, puzzle, game, casual, html5">
    <title>Fruit Merge Mania - 水果合成</title>
    <link rel="stylesheet" href="css/style.css">

    <!-- Phaser 3 Library -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
</head>

<body>
    <div id="game-container">
        <div id="game"></div>
        <div id="loading" class="loading-screen">
            <div class="loading-spinner"></div>
            <p>Loading...</p>
        </div>
    </div>

    <!-- Game Scripts -->
    <script src="js/utils/FruitConfig.js"></script>
    <script src="js/utils/ScoreManager.js"></script>
    <script src="js/utils/AudioManager.js"></script>
    <script src="js/objects/Fruit.js"></script>
    <script src="js/scenes/BootScene.js"></script>
    <script src="js/scenes/MenuScene.js"></script>
    <script src="js/scenes/PauseScene.js"></script>
    <script src="js/scenes/GameScene.js"></script>
    <script src="js/scenes/GameOverScene.js"></script>
    <script src="js/main.js"></script>

    <script>
        // Hide loading screen when game loads (优化：立即隐藏)
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('loading').style.display = 'none';
            }, 300);
        });
    </script>
</body>

</html>

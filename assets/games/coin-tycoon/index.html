<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>金币大亨 · 深渊觉醒</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;600;700;900&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body>
  <div class="app" id="app">
    <!-- 顶部栏 -->
    <header class="top-bar">
      <h1 class="game-title">金币大亨</h1>
      <div class="top-stats">
        <div class="ts" id="ts-coins">
          <span class="svg-icon" style="width:18px;height:18px;color:var(--p)"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="6" fill="#0a0a0f"/><circle cx="12" cy="12" r="4" fill="currentColor"/></svg></span>
          <span class="v" id="hd-coins">0</span>
          <span class="l">金币</span>
        </div>
        <div class="ts" id="ts-cps">
          <span class="svg-icon" style="width:18px;height:18px;color:var(--s)"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 3a1 1 0 0 0-2 0v1h-1a1 1 0 0 0 0 2h4a2 2 0 1 1 0 4h-1v2h-1v-2H9a1 1 0 0 1 0-2h5a1 1 0 1 0 0-2h-1V4z"/><path d="M12 19a1 1 0 0 1-1-1v-1h-1a1 1 0 1 1 0-2h4a2 2 0 1 1 0 4h-1v1a1 1 0 0 1-1 1z"/><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="1" fill="#0a0a0f"/></svg></span>
          <span class="v" id="hd-cps">0</span>
          <span class="l">/秒</span>
        </div>
        <div class="ts" id="ts-click">
          <span class="svg-icon" style="width:18px;height:18px;color:var(--og)"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 3a1 1 0 0 1 1 1v8h-1a1 1 0 1 1 0-2V4a1 1 0 0 1 1-1z"/><path d="M16 3a1 1 0 0 1 1 1v4h-1a1 1 0 1 1 0-2V4a1 1 0 0 1 1-1z"/><path d="M12 5a1 1 0 0 1 1 1v5h-1a1 1 0 1 1 0-2V6a1 1 0 0 1 1-1z"/><path d="M13.5 12a.5.5 0 0 0-.5.5v7a.5.5 0 0 0 .707.447l9-4.5a.5.5 0 0 0-.007-.894l-9-4.5A.5.5 0 0 0 13.5 12z"/></svg></span>
          <span class="v" id="hd-click">1</span>
          <span class="l">点击力</span>
        </div>
      </div>
      <div class="top-btns">
        <button class="tbtn" id="btn-sound" title="音效">
          <span class="svg-icon" style="color:var(--txm)"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg></span>
        </button>
        <button class="tbtn" id="btn-theme" title="主题">
          <span class="svg-icon" style="color:var(--txm)"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg></span>
        </button>
        <button class="tbtn" id="btn-save" title="保存">
          <span class="svg-icon" style="color:var(--txm)"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg></span>
        </button>
        <button class="tbtn" id="btn-settings" title="设置">
          <span class="svg-icon" style="color:var(--txm)"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></span>
        </button>
      </div>
    </header>

    <!-- 主内容 -->
    <main class="main">
      <!-- 左侧面板 -->
      <aside class="left-panel">
        <!-- 玩家信息行 -->
        <div class="player-row">
          <div class="p-card avatar-card">
            <div class="p-avatar">
              <span class="svg-icon" style="width:22px;height:22px;color:var(--s)"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="5"/><path d="M4 21c0-4.5 3.6-8 8-8s8 3.5 8 8"/></svg></span>
            </div>
            <div class="p-info">
              <div class="p-title" id="player-title">新手矿工</div>
              <div class="p-lvl">Lv.<span id="player-level">1</span></div>
              <div class="p-exp">
                <div class="p-exp-f" id="player-exp-bar" style="width:0%"></div>
              </div>
            </div>
          </div>

          <div class="p-card chapter-card">
            <div class="p-avatar">
              <span class="svg-icon" style="width:22px;height:22px;color:var(--pp)"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/><line x1="8" y1="7" x2="16" y2="7"/><line x1="8" y1="11" x2="14" y2="11"/></svg></span>
            </div>
            <div class="p-info">
              <div class="p-title" id="chapter-name">第1章</div>
              <div class="p-lvl" id="chapter-progress">0%</div>
              <div class="p-exp">
                <div class="p-exp-f" id="chapter-bar" style="width:0%"></div>
              </div>
            </div>
          </div>

          <div class="p-card daily-card">
            <div class="p-avatar">
              <span class="svg-icon" style="width:22px;height:22px;color:var(--og)"><svg viewBox="0 0 24 24" fill="currentColor"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg></span>
            </div>
            <div class="p-info">
              <div class="p-title">日常任务</div>
              <div class="p-lvl"><span id="daily-pts">0</span>/50</div>
              <div class="p-exp">
                <div class="p-exp-f" id="daily-bar" style="width:0%"></div>
              </div>
            </div>
          </div>

          <div class="p-card prestige-card">
            <div class="p-avatar">
              <span class="svg-icon" style="width:22px;height:22px;color:var(--pd)"><svg viewBox="0 0 24 24" fill="currentColor"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></span>
            </div>
            <div class="p-info">
              <div class="p-title">转生点</div>
              <div class="p-lvl"><span id="prestige-pts">0</span>点</div>
            </div>
          </div>
        </div>

        <!-- 点击区域 -->
        <div class="panel click-panel">
          <div class="panel-title">
            <span>
              <span class="svg-icon" style="width:16px;height:16px;margin-right:6px;color:var(--p)"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="6" fill="#0a0a0f"/><circle cx="12" cy="12" r="4" fill="currentColor"/></svg></span>
              点击挖矿
            </span>
          </div>
          <button class="coin-btn" id="coin-btn">
            <span class="svg-icon" style="width:48px;height:48px"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="6" fill="#422006"/><circle cx="12" cy="12" r="4" fill="currentColor"/></svg></span>
            <span class="coin-text">挖矿</span>
          </button>
        </div>

        <!-- Boss区域 -->
        <div class="panel boss-panel">
          <div class="panel-title">
            <span>
              <span class="svg-icon" style="width:16px;height:16px;margin-right:6px;color:var(--a)"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10"/><circle cx="9" cy="10" r="2" fill="#0a0a0f"/><circle cx="15" cy="10" r="2" fill="#0a0a0f"/><path d="M9 15c1.5 2 4.5 2 6 0" stroke="#0a0a0f" stroke-width="1.5" fill="none"/></svg></span>
              Boss挑战
            </span>
            <span class="boss-lvl">Lv.<span id="boss-level">1</span></span>
          </div>
          <div class="boss-info">
            <div class="boss-avatar">
              <span class="svg-icon" style="width:36px;height:36px"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10"/><circle cx="9" cy="10" r="2" fill="#0a0a0f"/><circle cx="15" cy="10" r="2" fill="#0a0a0f"/><path d="M9 15c1.5 2 4.5 2 6 0" stroke="#0a0a0f" stroke-width="1.5" fill="none"/></svg></span>
            </div>
            <div class="boss-details">
              <div class="boss-name" id="boss-name">矿洞守护者</div>
              <div class="boss-hp-bar">
                <div class="boss-hp-f" id="boss-hp-bar" style="width:100%"></div>
              </div>
              <div class="boss-hp-text"><span id="boss-hp">1000</span>/<span id="boss-max-hp">1000</span></div>
            </div>
          </div>
          <button class="boss-atk" id="boss-atk-btn">
            <span class="svg-icon" style="width:18px;height:18px"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6-4.3 4.3L10 10a1 1 0 0 0-1.4-1.4l-4 4a1 1 0 0 0 1.4 1.4l2.3-2.3 2.7 2.7a1 1 0 0 0 1.4 0l5-5 1.6 1.6a1 1 0 0 0 1.4-1.4l-3-3z"/><path d="M4 20h16"/></svg></span>
            攻击Boss
          </button>
        </div>
      </aside>

      <!-- 右侧面板 -->
      <section class="right-panel">
        <!-- 导航标签 -->
        <nav class="nav-tabs" id="nav-tabs">
          <button class="nav-t on" data-t="up">
            <span class="svg-icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M18 20V10M12 20V4M6 20v-6"/></svg></span>
            升级
          </button>
          <button class="nav-t" data-t="sk">
            <span class="svg-icon"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="3"/><circle cx="19" cy="5" r="2"/><circle cx="5" cy="19" r="2"/></svg></span>
            技能
          </button>
          <button class="nav-t" data-t="eq">
            <span class="svg-icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a3 3 0 1 1-4.24 4.24l-1.6-1.6a1 1 0 0 0-1.4 1.4l1.6 1.6a5 5 0 1 0 7.07-7.07l-1.6-1.6a1 1 0 0 0-1.4 0z"/></svg></span>
            装备
          </button>
          <button class="nav-t" data-t="pt">
            <span class="svg-icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 12c0-4.4 3.6-8 8-8s8 3.6 8 8-3.6 8-8 8-8-3.6-8-8z"/><circle cx="9" cy="10" r="1.5"/><circle cx="15" cy="10" r="1.5"/><path d="M9 15a3 3 0 0 0 6 0"/></svg></span>
            宠物
          </button>
          <button class="nav-t" data-t="rs">
            <span class="svg-icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0 0 20 10 10 0 0 0 0-20z"/><path d="M12 6v6l4 2"/></svg></span>
            研究
          </button>
          <button class="nav-t" data-t="gt">
            <span class="svg-icon"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 12l2 2 4-4"/></svg></span>
            祈愿
          </button>
          <button class="nav-t" data-t="exp">
            <span class="svg-icon"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg></span>
            远征
          </button>
          <button class="nav-t" data-t="wboss">
            <span class="svg-icon"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10"/><path d="M12 6v12M6 12h12"/></svg></span>
            世界Boss
          </button>
          <button class="nav-t" data-t="ach">
            <span class="svg-icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5C7 4 6 9 6 9z"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5C17 4 18 9 18 9z"/><path d="M4 22h16"/><path d="M10 22V16h4v6"/><path d="M6 9C6 4 12 2 12 2s6 2 6 7c0 4-6 5-6 5s-6-1-6-5z"/></svg></span>
            成就
          </button>
          <button class="nav-t" data-t="col">
            <span class="svg-icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg></span>
            收藏
          </button>
        </nav>

        <!-- 标签内容 -->
        <div class="tab-container">
          <div class="tab-c on" id="tc-up"></div>
          <div class="tab-c" id="tc-sk"></div>
          <div class="tab-c" id="tc-eq"></div>
          <div class="tab-c" id="tc-pt"></div>
          <div class="tab-c" id="tc-rs"></div>
          <div class="tab-c" id="tc-gt"></div>
          <div class="tab-c" id="tc-exp"></div>
          <div class="tab-c" id="tc-wboss"></div>
          <div class="tab-c" id="tc-ach"></div>
          <div class="tab-c" id="tc-col"></div>
        </div>
      </section>
    </main>
  </div>

  <!-- 通知容器 -->
  <div class="notification-container" id="notification-container"></div>

  <!-- 背景Canvas -->
  <canvas id="bgc"></canvas>

  <!-- 主脚本 -->
  <script type="module" src="js/main.js"></script>

  <!-- 内联脚本 -->
  <script>
    document.querySelectorAll('.nav-t').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.nav-t').forEach(b => b.classList.remove('on'));
        document.querySelectorAll('.tab-c').forEach(c => c.classList.remove('on'));
        btn.classList.add('on');
        const tabId = 'tc-' + btn.dataset.t;
        document.getElementById(tabId)?.classList.add('on');
      });
    });

    document.getElementById('coin-btn')?.addEventListener('click', (e) => {
      if (window.game) {
        const result = window.game.handleClick();
        // 数字弹出
        if (window.showNumberPop) {
          window.showNumberPop(result.earned, result.isCrit, e.clientX, e.clientY - 20);
        }
        // 立即刷新升级按钮状态
        if (window.refreshUpgradeButtons) {
          window.refreshUpgradeButtons();
        }
        if (result.isCrit) {
          document.getElementById('coin-btn').style.transform = 'scale(1.15)';
          setTimeout(() => {
            document.getElementById('coin-btn').style.transform = '';
          }, 100);
        }
      }
    });
  </script>
</body>
</html>

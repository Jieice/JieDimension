<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberstorm Arena - 开发中</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2e 50%, #0a1a2e 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: #fff;
        }
        .container {
            text-align: center;
            padding: 40px;
            max-width: 600px;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            background: linear-gradient(90deg, #00d4ff, #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .status {
            display: inline-block;
            padding: 8px 20px;
            background: rgba(255, 0, 255, 0.2);
            border: 1px solid #ff00ff;
            border-radius: 20px;
            color: #ff00ff;
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }
        p {
            color: #8888aa;
            line-height: 1.8;
            margin-bottom: 1.5rem;
        }
        .features {
            text-align: left;
            background: rgba(255,255,255,0.05);
            padding: 20px;
            border-radius: 12px;
            margin: 2rem 0;
        }
        .features li {
            color: #aaa;
            margin: 8px 0;
            list-style: none;
        }
        .features li::before {
            content: '⚡ ';
            color: #00d4ff;
        }
        .back-link {
            display: inline-block;
            margin-top: 2rem;
            padding: 12px 30px;
            background: linear-gradient(90deg, #00d4ff, #ff00ff);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .back-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Cyberstorm Arena</h1>
        <div class="status">🚧 开发中</div>
        <p>一款赛博朋克风格的大逃杀游戏，在数字竞技场中与敌人战斗，成为最后的幸存者。</p>
        <ul class="features">
            <li>大逃杀模式 - 在不断缩小的安全区中生存</li>
            <li>能量武器 - 多种未来科技武器</li>
            <li>战术竞技 - 利用地形和策略取胜</li>
            <li>在线对战 - 与其他玩家实时竞技</li>
        </ul>
        <p>游戏正在紧张开发中，敬请期待！</p>
        <a href="https://jieice.github.io/JieDimension/games.html" class="back-link">← 返回游戏列表</a>
    </div>
</body>
</html>

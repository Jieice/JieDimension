<!-- Puter.js AI Chatbot Widget -->
<style>
    /* Chatbot Container styling */
    #puter-chatbot-wrapper {
        position: fixed;
        bottom: 30px;
        right: 30px;
        z-index: 99999;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Floating Button */
    #puter-chat-toggle {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: linear-gradient(135deg, #6e8efb, #a777e3);
        color: white;
        border: none;
        box-shadow: 0 4px 15px rgba(110, 142, 251, 0.4);
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
        transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s ease;
    }
    
    #puter-chat-toggle:hover {
        transform: scale(1.1) translateY(-5px);
        box-shadow: 0 8px 25px rgba(110, 142, 251, 0.6);
    }
    
    #puter-chat-toggle svg {
        width: 28px;
        height: 28px;
        fill: currentColor;
    }

    /* Chat Window */
    #puter-chat-window {
        position: absolute;
        bottom: 80px;
        right: 0;
        width: 380px;
        height: 550px;
        background: rgba(26, 26, 36, 0.75);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        box-shadow: 0 15px 35px rgba(0,0,0,0.3);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        opacity: 0;
        visibility: hidden;
        transform: translateY(20px) scale(0.95);
        transform-origin: bottom right;
        transition: all 0.3s cubic-bezier(0.19, 1, 0.22, 1);
    }
    
    #puter-chat-window.active {
        opacity: 1;
        visibility: visible;
        transform: translateY(0) scale(1);
    }

    /* Header */
    #puter-chat-header {
        padding: 18px 20px;
        background: rgba(255, 255, 255, 0.05);
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        color: white;
        font-weight: 600;
        font-size: 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    #puter-chat-header .title-area {
        display: flex;
        align-items: center;
    }

    #puter-chat-header .status-dot {
        width: 8px;
        height: 8px;
        background-color: #4cd964;
        border-radius: 50%;
        display: inline-block;
        margin-right: 8px;
        box-shadow: 0 0 8px rgba(76, 217, 100, 0.5);
    }

    #puter-chat-close {
        cursor: pointer;
        opacity: 0.7;
        transition: opacity 0.2s;
        background: none;
        border: none;
        color: white;
        font-size: 20px;
    }
    
    #puter-chat-close:hover {
        opacity: 1;
    }

    /* Messages Area */
    #puter-chat-messages {
        flex: 1;
        padding: 20px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 15px;
        scrollbar-width: thin;
        scrollbar-color: rgba(255, 255, 255, 0.2) transparent;
    }

    /* Scrollbar */
    #puter-chat-messages::-webkit-scrollbar {
        width: 6px;
    }
    #puter-chat-messages::-webkit-scrollbar-track {
        background: transparent;
    }
    #puter-chat-messages::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.2);
        border-radius: 10px;
    }

    /* Individual Messages */
    .puter-msg {
        max-width: 85%;
        padding: 12px 16px;
        border-radius: 16px;
        font-size: 14px;
        line-height: 1.5;
        color: white;
        animation: fadeIn 0.3s ease;
        word-break: break-word;
    }
    
    .puter-msg.user {
        background: linear-gradient(135deg, #6e8efb, #a777e3);
        align-self: flex-end;
        border-bottom-right-radius: 4px;
        box-shadow: 0 4px 10px rgba(110, 142, 251, 0.2);
    }
    
    .puter-msg.bot {
        background: rgba(255, 255, 255, 0.1);
        align-self: flex-start;
        border-bottom-left-radius: 4px;
        border: 1px solid rgba(255, 255, 255, 0.05);
    }
    
    .puter-msg.loading {
        background: transparent;
        border: none;
        align-self: flex-start;
        display: flex;
        gap: 4px;
        padding: 12px;
    }
    
    .typing-dot {
        width: 6px;
        height: 6px;
        background: rgba(255, 255, 255, 0.6);
        border-radius: 50%;
        animation: typing 1.4s infinite ease-in-out both;
    }
    
    .typing-dot:nth-child(1) { animation-delay: -0.32s; }
    .typing-dot:nth-child(2) { animation-delay: -0.16s; }

    @keyframes typing {
        0%, 80%, 100% { transform: scale(0); }
        40% { transform: scale(1); }
    }
    
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    /* Input Area */
    #puter-chat-input-area {
        padding: 15px;
        background: rgba(0, 0, 0, 0.2);
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        display: flex;
        gap: 10px;
    }
    
    #puter-chat-input {
        flex: 1;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 20px;
        padding: 10px 15px;
        color: white;
        font-family: inherit;
        outline: none;
        transition: border-color 0.3s;
    }
    
    #puter-chat-input:focus {
        border-color: rgba(110, 142, 251, 0.5);
    }
    
    #puter-chat-input::placeholder {
        color: rgba(255, 255, 255, 0.4);
    }
    
    #puter-chat-send {
        background: transparent;
        border: none;
        color: #a777e3;
        cursor: pointer;
        padding: 0 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.2s, color 0.2s;
    }
    
    #puter-chat-send:hover {
        transform: scale(1.1);
        color: #6e8efb;
    }
    
    #puter-chat-send svg {
        width: 20px;
        height: 20px;
        fill: currentColor;
    }
    
    /* Markdown formatting inside bot messages */
    .puter-msg.bot p { margin: 0 0 10px 0; }
    .puter-msg.bot p:last-child { margin: 0; }
    .puter-msg.bot code { background: rgba(0,0,0,0.3); padding: 2px 5px; border-radius: 4px; font-family: monospace; }
    .puter-msg.bot pre { background: rgba(0,0,0,0.3); padding: 10px; border-radius: 6px; overflow-x: auto; margin: 5px 0; }
</style>

<div id="puter-chatbot-wrapper">
    <div id="puter-chat-window">
        <div id="puter-chat-header">
            <div class="title-area"><span class="status-dot"></span> JieDimension AI 客服</div>
            <button id="puter-chat-close" aria-label="Close Chat">&times;</button>
        </div>
        <div id="puter-chat-messages">
            <div class="puter-msg bot">你好！我是基于 <strong>Puter.js (GPT-5.4)</strong> 的 AI 助手。有什么我可以帮你的吗？</div>
        </div>
        <div id="puter-chat-input-area">
            <input type="text" id="puter-chat-input" placeholder="输入你想了解的内容..." autocomplete="off"/>
            <button id="puter-chat-send" aria-label="Send">
                <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
            </button>
        </div>
    </div>
    
    <button id="puter-chat-toggle" aria-label="Open AI Chat">
        <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"/></svg>
    </button>
</div>

<!-- 引入 Puter.js -->
<script src="https://js.puter.com/v2/"></script>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        const toggleBtn = document.getElementById('puter-chat-toggle');
        const closeBtn = document.getElementById('puter-chat-close');
        const chatWindow = document.getElementById('puter-chat-window');
        const messagesDiv = document.getElementById('puter-chat-messages');
        const inputField = document.getElementById('puter-chat-input');
        const sendBtn = document.getElementById('puter-chat-send');
        
        let isChatOpen = false;
        let isProcessing = false;
        
        // 保存聊天上下文
        let chatHistory = [];

        function toggleChat() {
            isChatOpen = !isChatOpen;
            if (isChatOpen) {
                chatWindow.classList.add('active');
                inputField.focus();
            } else {
                chatWindow.classList.remove('active');
            }
        }

        toggleBtn.addEventListener('click', toggleChat);
        closeBtn.addEventListener('click', function() {
            isChatOpen = false;
            chatWindow.classList.remove('active');
        });

        // 将文本添加到聊天记录
        function addMessage(text, sender) {
            const msgEl = document.createElement('div');
            msgEl.className = 'puter-msg ' + sender;
            // 简单处理换行
            msgEl.innerHTML = text.replace(/\n/g, '<br>');
            messagesDiv.appendChild(msgEl);
            scrollToBottom();
            return msgEl;
        }

        function showLoading() {
            const loadingEl = document.createElement('div');
            loadingEl.className = 'puter-msg loading';
            loadingEl.id = 'puter-loading';
            loadingEl.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
            messagesDiv.appendChild(loadingEl);
            scrollToBottom();
            return loadingEl;
        }

        function removeLoading() {
            const loadingEl = document.getElementById('puter-loading');
            if (loadingEl) {
                loadingEl.remove();
            }
        }

        function scrollToBottom() {
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        async function handleSend() {
            const text = inputField.value.trim();
            if (!text || isProcessing) return;
            
            // 1. 发送用户消息
            inputField.value = '';
            addMessage(text, 'user');
            isProcessing = true;
            chatHistory.push({ role: 'user', content: text });
            showLoading();
            
            try {
                // 构建包含人设和上下文的 Prompt
                let systemPrompt = "系统提示：你是 JieDimension 网站的专属 AI 助手。该网站展示了主理人的开源游戏和 Blender 作品。请保持回答简短、友好。";
                
                // 将历史记录拼接到请求中以支持多轮对话
                let context = systemPrompt + "\n\n";
                chatHistory.forEach(msg => {
                    context += `${msg.role === 'user' ? '用户' : 'AI'}: ${msg.content}\n`;
                });
                context += "AI:";
                
                // 调用 Puter.js 原生 API
                // 默认使用最新支持的模型如 gpt-5.4 或系统推荐默认模型
                let response = await puter.ai.chat(context, { model: 'gpt-5.4' });
                
                removeLoading();
                
                // 获取回复文本
                const replyText = typeof response === 'string' ? response : (response?.message?.content || String(response));
                
                addMessage(replyText, 'bot');
                chatHistory.push({ role: 'assistant', content: replyText });
                
            } catch (err) {
                console.error("Puter AI Chat Error:", err);
                removeLoading();
                addMessage("抱歉，连接到 AI 出现错误。也许需要您授权或者服务当前不可用。(" + err.message + ")", 'bot');
                // 移除刚才未成功的提问，允许重试
                chatHistory.pop();
            } finally {
                isProcessing = false;
                inputField.focus();
            }
        }

        sendBtn.addEventListener('click', handleSend);
        inputField.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                handleSend();
            }
        });
    });
</script>

# 网站配置
title: JieDimension Studio
tagline: 界维互动工作室
description: 专注于 AI 智能体、虚拟交互与独立开发
url: https://www.jiece.art
baseurl: ""

# 开发者信息
author:
  name: JieDimension
  name_cn: 界维互动
  email: 3348149202@qq.com

# 构建设置
markdown: kramdown
theme: null
permalink: /blog/:year/:month/:day/:title/

# 集合配置
collections:
  games:
    output: true
    permalink: /games/:name/

# 默认值
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      comments: true
  - scope:
      path: ""
      type: "games"
    values:
      layout: "game"

# 分页
paginate: 10
paginate_path: "/blog/page:num/"

# 插件
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate

# 排除文件
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .git
  - .gitignore
  - README.md

# 时区
timezone: Asia/Shanghai

